[package]
name = "ingest"
version = "0.1.0"
edition = "2024"
description = "The background compacter: merges a table's small Parquet files into target-sized ones, encoding on the dispatch workers."

[dependencies]
dispatch = { path = "../dispatch" }
# The catalog: the compacter reads a table's files back and swaps the merged
# file in through it, and drives the catalog's write pipeline to re-encode.
catalog = { path = "../catalog" }
# The compacter's tests build input batches and assert on read-back rows.
arrow-array = { path = "../arrow-rs/arrow-array" }
arrow-schema = { path = "../arrow-rs/arrow-schema" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# `CreateTableRequest` / `Catalog::insert` etc., to set up catalog tables and
# write the small files the compaction tests merge.
planner = { path = "../planner" }
# Strict, spec-compliant reader used only as a test oracle: if arrow-rs's reader
# accepts our hand-rolled files, other engines (DuckDB, etc.) will too.
parquet = { path = "../arrow-rs/parquet", default-features = false, features = ["arrow", "snap"] }
dispatch = { path = "../dispatch" }
catalog = { path = "../catalog" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
