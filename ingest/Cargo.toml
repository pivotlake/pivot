[package]
name = "ingest"
version = "0.1.0"
edition = "2024"
description = "Receivers that ingest external telemetry (OTLP today) and sink it into Parquet files, offloading the CPU-heavy encode onto dispatch workers."

[dependencies]
dispatch = { path = "../dispatch" }
thriftparquet = { path = "../thriftparquet" }
# The catalog: each flushed Parquet file is registered with its table so new
# rows are queryable immediately, and the compacter reads files back / swaps
# them through it.
catalog = { path = "../catalog" }
# The Kafka source derives the Arrow schema it decodes records into from the
# destination table's declared columns (`CatalogTable::columns` -> planner
# `Type`). Already a transitive dependency via `catalog`, so this adds no build
# cost; naming it directly lets the schema mapping live in the `kafka` module.
planner = { path = "../planner" }

arrow-array = { path = "../arrow-rs/arrow-array" }
arrow-schema = { path = "../arrow-rs/arrow-schema" }
# Partitioned/sorted ingest: lexsort + partition (arrow-ord), concat + take
# (arrow-select), and arrow-json to record each file's partition tuple in the
# manifest. `uuid` names files so concurrent ingestors never collide.
arrow-ord = { path = "../arrow-rs/arrow-ord" }
arrow-select = { path = "../arrow-rs/arrow-select" }
arrow-arith = { path = "../arrow-rs/arrow-arith" }
arrow-json = { path = "../arrow-rs/arrow-json" }
# Dictionary encoding: cast a column to a dictionary array (intern + index).
arrow-cast = { path = "../arrow-rs/arrow-cast" }
uuid = { version = "1", features = ["v4"] }
# In-house Parquet encoding (no upstream `parquet` crate): the shared
# `thriftparquet` metadata/codec layer plus the same snappy lib the reader uses.
snap = { git = "https://github.com/Epsio-Labs/rust-snappy.git", rev = "b896aa24d6c85fa1b40f8746c3cc2185ca4084b9" }

# OTLP over gRPC. tonic 0.14 split prost codegen into `tonic-prost`; the
# generated service code lives in `opentelemetry-proto` (gen-tonic), so we only
# need tonic's server transport here.
tonic = { version = "0.14", features = ["server", "transport", "router", "codegen", "gzip"] }
prost = "0.14"
opentelemetry-proto = { version = "0.31", default-features = false, features = [
    "gen-tonic",
    "logs",
    "trace",
    "metrics",
] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
# OTLP column mappings are configured via TOML (see `otel::config`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"

# Kafka ingest source (see `kafka`). rdkafka wraps librdkafka (built from source
# via cmake) and gives the async `StreamConsumer`, consumer groups, and SASL/SSL.
rdkafka = { version = "0.37", default-features = false, features = [
    "tokio",
    "cmake-build",
    "libz",
    "ssl-vendored",
    "gssapi-vendored",
] }
# Decoding Confluent-framed Avro / Protobuf payloads into `serde_json::Value`
# (the single Arrow-construction path, via arrow-json). `apache-avro` decodes an
# Avro datum against a registry-fetched writer schema; `prost-reflect` +
# `protox` compile a registry `.proto` schema and decode a dynamic message.
apache-avro = "0.17"
# Dynamic Protobuf decode: compile the registry `.proto` (protox) into a
# descriptor pool and decode each message reflectively (prost-reflect, serde
# feature renders it to JSON). prost-reflect re-exports the matching prost /
# prost-types, so the protobuf island stays self-consistent regardless of the
# prost 0.14 used for OTLP above.
prost-reflect = { version = "0.14", features = ["serde"] }
# `protox-parse` compiles a single self-contained `.proto` (no imports) into a
# `FileDescriptorProto`; it shares prost-reflect's `prost-types`, so the
# descriptor set round-trips into a `DescriptorPool` by bytes.
protox-parse = "0.7"
# Confluent Schema Registry client: blocking HTTPS, like catalog's object stores.
ureq = { version = "2", features = ["json", "tls"] }

[dev-dependencies]
tempfile = "3"
# `CreateTableRequest` etc., to set up catalog tables in the register/compact
# integration tests.
planner = { path = "../planner" }
# Strict, spec-compliant reader used only as a test oracle: if arrow-rs's
# reader accepts our hand-rolled files, other engines (DuckDB, etc.) will too.
parquet = { path = "../arrow-rs/parquet", default-features = false, features = ["arrow", "snap"] }
# The OTLP-over-gRPC end-to-end test drives a running `Ingestor` from outside:
# `dispatch`/`catalog` to set up the engine + table and read rows back, and a
# `tonic` OTLP client (built from `opentelemetry-proto`'s gen-tonic code) to
# send telemetry over the wire. (All already resolved as normal dependencies.)
dispatch = { path = "../dispatch" }
catalog = { path = "../catalog" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tonic = { version = "0.14", features = ["transport"] }
opentelemetry-proto = { version = "0.31", default-features = false, features = [
    "gen-tonic",
    "logs",
] }
