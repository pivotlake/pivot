[package]
name = "datastore"
version.workspace = true
edition.workspace = true
description = "The Datastore / DatastoreTransaction traits: one named data source and its per-query snapshot transaction, resolving tables and DDL for the planner."

[dependencies]
planner = { workspace = true }
dispatch = { workspace = true }
# `Datastore::commit_transaction` is async so each backend chooses whether a
# commit hops to the blocking pool or finishes inline.
async-trait = "0.1"
