[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
dispatch = { path = "../dispatch" }
planner = { path = "../planner" }
catalog = { path = "../catalog" }
ingest = { path = "../ingest" }
arrow-array = { path = "../arrow-rs/arrow-array" }
arrow-schema = { path = "../arrow-rs/arrow-schema" }
arrow = { path = "../arrow-rs/arrow" }

tokio = { version = "1.40", features = ["rt-multi-thread", "net", "macros", "sync", "signal"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
pgwire = "0.39"
async-trait = "0.1"
futures = "0.3"
bytes = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.38.0"
# Only pulled in by the `perf` feature, for SIGINT-ing the `perf record` child
# so it flushes its report (a plain `Child::kill` would SIGKILL and lose it).
libc = { version = "0.2", optional = true }

[features]
# Staging-only per-query `perf record` profiling: when on, a session that runs
# `SET perf = 1` profiles each of its queries (one report per query) into the
# directory named by `PIVOT_PERF_DIR`. Without this feature every profiling path
# is compiled out and `SET perf = 1` is an accepted no-op, so there is no
# overhead in a normal build.
perf = ["dep:libc", "dispatch/perf"]

[[bin]]
name = "pivotdb-server"
path = "src/main.rs"

# Optimized like release but with debuginfo, so `perf` can resolve inlined
# frames and line numbers. Build the server for profiling with
# `cargo build --profile profiling --features perf`; plain `--release` stays lean.
[profile.profiling]
inherits = "release"
debug = true

[dev-dependencies]
tokio-postgres = "0.7"
tempfile = "3"
parquet = { path = "../arrow-rs/parquet", default-features = false, features = ["arrow", "snap"] }
core_affinity = "0.8.3"
rstest = "0.26"
# Pull catalog's `test_support` (MinIO / fake-gcs object-store harness) in for
# the bucket-backed end-to-end tests; the bin build keeps the plain catalog dep.
catalog = { path = "../catalog", features = ["test-support"] }
