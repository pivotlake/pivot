[package]
name = "server"
version.workspace = true
edition.workspace = true

[dependencies]
dispatch = { workspace = true }
planner = { workspace = true }
catalog = { workspace = true }
datastore-delta = { workspace = true }
metastore = { workspace = true }
metastore-yaml = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync", "signal"] }
axum = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
include_dir = "0.7"
lru = { workspace = true }
pgwire = "0.39"
# Generates per-process secrets for mock authentication of unknown users.
rand = { workspace = true }
# Derives the stand-in verifier answered for an unknown user (see `auth`).
sha2 = { workspace = true }
async-trait = "0.1"
futures = "0.3"
# Wire carriers for extended-protocol DATE/TIMESTAMP and NUMERIC values (their
# postgres-types ToSql/FromSql impls are enabled through pgwire's defaults).
chrono = { version = "0.4", default-features = false, features = ["std"] }
rust_decimal = { version = "1", features = ["db-postgres"] }
# Names the FromSql trait bound that pgwire's parameter decoding is built on.
postgres-types = "0.2"
clap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sysinfo = { workspace = true }
# Only pulled in by the `perf` feature, for SIGINT-ing the `perf record` child
# so it flushes its report (a plain `Child::kill` would SIGKILL and lose it).
libc = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# Reads and raises the process's open-file limit at startup (see `limits`).
nix = { version = "0.31.2", features = ["resource"] }

[features]
# Staging-only per-query `perf record` profiling: when on, a session that runs
# `SET perf = 1` profiles each of its queries (one report per query) into the
# directory named by `PIVOT_PERF_DIR`. Without this feature every profiling path
# is compiled out and `SET perf = 1` is an accepted no-op, so there is no
# overhead in a normal build.
perf = ["dep:libc", "dispatch/perf"]

[[bin]]
name = "pivotdb-server"
path = "src/main.rs"

[dev-dependencies]
# The chrono feature lets tests bind DATE/TIMESTAMP parameters client-side.
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
tempfile = { workspace = true }
parquet = { workspace = true }
# The variant end-to-end test builds the documents it loads.
parquet-variant-compute = { workspace = true }
core_affinity = { workspace = true }
rstest = { workspace = true }
# Pull catalog's `test_support` (MinIO / fake-gcs object-store harness) in for
# the bucket-backed end-to-end tests; the bin build keeps the plain catalog dep.
datastore-delta = { workspace = true, features = ["test-support"] }
