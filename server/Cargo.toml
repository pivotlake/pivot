[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
dispatch = { path = "../dispatch" }
planner = { path = "../planner" }
goose = { path = "../goose" }
ingest = { path = "../ingest" }
arrow-array = { path = "../arrow-rs/arrow-array" }
arrow-schema = { path = "../arrow-rs/arrow-schema" }
arrow = { path = "../arrow-rs/arrow" }

tokio = { version = "1.40", features = ["rt-multi-thread", "net", "macros", "sync", "signal"] }
pgwire = "0.39"
async-trait = "0.1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.38.0"

[[bin]]
name = "pivotdb-server"
path = "src/main.rs"

[dev-dependencies]
tokio-postgres = "0.7"
tempfile = "3"
parquet = { path = "../arrow-rs/parquet", default-features = false, features = ["arrow", "snap"] }
core_affinity = "0.8.3"
rstest = "0.26"
