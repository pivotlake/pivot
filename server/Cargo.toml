[package]
name = "server"
version.workspace = true
edition.workspace = true

[dependencies]
dispatch = { workspace = true }
planner = { workspace = true }
catalog = { workspace = true }
compact = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync", "signal"] }
axum = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
include_dir = "0.7"
# `pg-type-chrono` lets the wire encoders speak chrono's civil date/time types,
# which is how DATE/TIMESTAMP columns and parameters get correct binary (and
# text) encodings in the extended query protocol.
pgwire = { version = "0.39", features = ["pg-type-chrono"] }
# The wire-value traits pgwire builds on, implemented directly for the NUMERIC
# binary encoding of aggregate results.
postgres-types = "0.2"
bytes = "1"
chrono = "0.4"
async-trait = "0.1"
futures = "0.3"
clap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sysinfo = { workspace = true }
# Only pulled in by the `perf` feature, for SIGINT-ing the `perf record` child
# so it flushes its report (a plain `Child::kill` would SIGKILL and lose it).
libc = { workspace = true, optional = true }

[features]
# Staging-only per-query `perf record` profiling: when on, a session that runs
# `SET perf = 1` profiles each of its queries (one report per query) into the
# directory named by `PIVOT_PERF_DIR`. Without this feature every profiling path
# is compiled out and `SET perf = 1` is an accepted no-op, so there is no
# overhead in a normal build.
perf = ["dep:libc", "dispatch/perf"]

[[bin]]
name = "pivotdb-server"
path = "src/main.rs"

[dev-dependencies]
# `with-chrono-0_4` lets the e2e tests decode binary DATE/TIMESTAMP results.
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
tempfile = { workspace = true }
parquet = { workspace = true }
core_affinity = { workspace = true }
rstest = { workspace = true }
# Pull catalog's `test_support` (MinIO / fake-gcs object-store harness) in for
# the bucket-backed end-to-end tests; the bin build keeps the plain catalog dep.
catalog = { workspace = true, features = ["test-support"] }
