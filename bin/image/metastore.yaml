# The image's initial metastore file. The server owns and rewrites this file
# (CREATE USER lands here), so these comments disappear on the first rewrite.
# A mount over /var/lib/pivot replaces it and must bring its own metastore
# file; the server refuses to start without one.
datastores:
  default:
    kind: delta
    location: /var/lib/pivot/datastores/default
    default: true
users:
  pivot:
    auth:
      method: trust
