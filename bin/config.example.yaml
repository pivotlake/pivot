# One file configures a whole instance. Its top level is the instance itself:
# the resources it runs on. Every one of them has a default. `server` is the
# endpoint; `datastores`, `secrets` and `users` are
# what the instance serves, belong to the operator, and are never rewritten;
# `metastore` names the file the server writes to, where CREATE USER lands.

# Buffer-pool budget: a size (suffixes k/m/g/t, base-1024), or a share of the
# machine's total memory minus a 4 GiB reserve for allocations outside the
# pool. Defaults to 80%.
# memory: 32g

# Dispatch worker threads. Defaults to the machine's core count.
# workers: 16

# How often each datastore brings itself up to date with its store: the
# tables it has, and each table's committed files. For shared remote stores,
# this bounds how stale a query's view of another process's commits can be;
# this process's own commits are visible immediately. Defaults to 30s.
datastore_refresh_interval: 30s

# What the server logs, to stdout: a level for everything, such as info (the
# default) or debug.
# log: info

# The PostgreSQL endpoint. Every setting has a default, so the section can be
# left out entirely.
server:
  # TCP socket the endpoint binds to. Defaults to 127.0.0.1:5432, so set this
  # to reach the server from beyond loopback.
  bind: 127.0.0.1:5432

  # Certificate to present to a client that asks to encrypt its connection
  # (`psql "sslmode=require"`). Omitted means those requests are turned down and
  # every session is plaintext. Both files are PEM; both are required once the
  # section is present. Present makes SSL available, not compulsory: a client
  # that asks for plaintext still gets it.
  # tls:
  #   cert: /etc/pivot/server.crt   # the server's certificate, then any intermediates
  #   key: /etc/pivot/server.key    # its private key; keep it readable only by the server

# Exactly one datastore, here or in the metastore file, must set `default: true`.
# It is the current database, so unqualified names such as `main.events` resolve
# against it.
datastores:
  # `kind` selects the datastore implementation (only `pivot` today). The storage backend is
  # inferred from `location`: a local path here, an S3 URI for `warm` below.
  default:
    kind: pivotlake
    location: /var/lib/pivot/datastores/default
    default: true

  # Other entries are attached as databases and can be queried with three-part
  # names such as `warm.main.events`. Compaction is on by default; run it in
  # only one process per datastore (set `compact: false` on the others).
  warm:
    kind: pivotlake
    location: s3://example-bucket/warm/
    compact: true
    compact_bytes: 128m
    compact_merge_bytes: 192m
    compact_min_files: 100
    compact_parallelism: 3

  # A `gs://` location opens a Google Cloud Storage store.
  cold:
    kind: pivotlake
    location: gs://example-bucket/cold/

# The credentials a remote location is opened with, kept apart from the
# datastores so a bucket's keys are written once however many datastores sit
# in it. `scope` is the path a secret covers; the most specific scope covering
# a location authenticates it, and two secrets may not claim the same scope.
# Omit `scope` to cover every location of the type.
#
# An `s3://` datastore without a covering secret uses anonymous requests, for
# public buckets. A `gs://` one without a secret falls back to the ambient
# Application Default Credentials (GOOGLE_APPLICATION_CREDENTIALS, `gcloud
# auth application-default login`, or the workload identity of the Google
# compute instance).
secrets:
  example-bucket:
    type: s3
    scope: s3://example-bucket/
    region: us-east-1
    access_key_id: replace-me
    secret_access_key: replace-me
    # endpoint: http://localhost:9000 # MinIO / S3-compatible

  # google:
  #   type: gcs
  #   scope: gs://example-bucket/
  #   credentials_file: /etc/pivot/gcs-key.json

# `pivot` is served whatever this map says, so a server is always reachable. It
# is trusted unless defined here, as it is below: trust proves no identity
# (anyone using the name is accepted), so give it a `password` instead to
# require one of it.
users:
  pivot:
    auth:
      method: trust

  # A password is written as is; the server derives a SCRAM-SHA-256 verifier
  # from it at startup and never sends or stores the password itself.
  # pivot:
  #   auth:
  #     method: password
  #     password: Password1337

  # A SCRAM-SHA-256 method contains the precomputed verifier instead, which is
  # how the server stores a user CREATE USER made.
  # analytics:
  #   auth:
  #     method: scram-sha-256
  #     verifier: "pivot-scram-sha-256$4096:..."

# The file the server writes to: the same three maps as above, without a
# `server` or `metastore` section, owned by the server process. CREATE USER
# adds to it. The file must exist; a name defined both here and there stops
# startup. Leave the section out to run without one, in which case CREATE USER
# is refused.
metastore:
  kind: file
  path: /var/lib/pivot/metastore.yaml
