[package]
name = "catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "PivotDB's catalog: the Datastore and Metastore interfaces, the read-only `system` datastore, and the cross-datastore catalog that presents every configured datastore to the planner."

[dependencies]
planner = { workspace = true }
dispatch = { workspace = true }
# The planner-owned `read_parquet(path)` table function reads files outside
# the configured datastores.
parquet-engine = { workspace = true }
object-storage = { workspace = true }
# The `system` datastore assembles its relations as Arrow batches.
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
thiserror = { workspace = true }
# `DatastoreTransaction::commit` and `CatalogTransaction::commit` are async: a
# backend decides whether its commit hops to the blocking pool or finishes
# inline, and the composite awaits each touched datastore's own commit.
async-trait = "0.1"
# The staging queue a CREATE USER's dataflow pushes into.
crossbeam-deque = { workspace = true }
# A stored SCRAM verifier's salt and salted password are base64 in its text form.
base64 = { workspace = true }
