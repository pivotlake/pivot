[package]
name = "catalog"
version = "0.1.0"
edition = "2024"

[dependencies]
planner = { path = "../planner" }
dispatch = { path = "../dispatch" }
thriftparquet = { path = "../thriftparquet" }
arrow-array = { path = "../arrow-rs/arrow-array" }
arrow-ord = { path = "../arrow-rs/arrow-ord" }
arrow-arith = { path = "../arrow-rs/arrow-arith" }
arrow-schema = { path = "../arrow-rs/arrow-schema" }
arrow-buffer = { path = "../arrow-rs/arrow-buffer" }
arrow-row = { path = "../arrow-rs/arrow-row" }
arrow-select = { path = "../arrow-rs/arrow-select" }
arrow-cast = { path = "../arrow-rs/arrow-cast" }
thiserror = "2.0.18"
tracing = "0.1"
bytes = "1.11.0"
crossbeam-deque = "0.8.6"
ahash = "0.8.12"
snap = { git = "https://github.com/Epsio-Labs/rust-snappy.git", rev = "b896aa24d6c85fa1b40f8746c3cc2185ca4084b9" }
# The database-level `_pivot_manifest.json` table index is serialized as JSON.
# Per-table state is standard Delta Lake metadata under each table's `_delta_log`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Synchronous object-store access for the catalog control plane (LIST/GET/PUT/
# conditional-PUT of the manifest and initial Delta commit), so the engine
# never spins up an async runtime.
# `ureq` is blocking HTTP + rustls; `aws-sigv4::sign` is a pure sync function we
# call to sign S3 requests (the tokio it transitively pulls is never driven).
# Credentials are read from the environment ourselves. GCS uses an OAuth bearer
# over the JSON API. The hot data path uses none of this — it's on the ring.
ureq = { version = "2", features = ["json"] }
aws-sigv4 = "1"
aws-credential-types = "1"
# Parse S3 ListObjectsV2 XML; GCS listing is JSON via serde_json.
quick-xml = { version = "0.37", features = ["serialize"] }
# GCS OAuth: sign service-account JWTs (RS256) with ring (already in the tree via
# rustls) and base64-encode the JWT segments.
ring = "0.17"
base64 = "0.22"
# Build/parse the concrete URLs handed to the io_uring HTTP reader.
url = "2"
# Delta Kernel owns per-table snapshot semantics.  The catalog index remains
# Pivot's `_pivot_manifest.json`, while every indexed table is loaded from its
# standard `_delta_log` through the reference Arrow/object-store engine.
delta_kernel = { version = "0.25.0", features = ["arrow-conversion", "internal-api"] }
delta_kernel_default_engine = { version = "0.25.0", features = ["rustls", "arrow-58"] }
uuid = { version = "1", features = ["v4"] }
# Optional, behind the `test-support` feature: the in-Docker object-store test
# harness exposed as `catalog::test_support`. testcontainers brings up MinIO and
# fake-gcs-server; tempfile backs the local() backend. (The harness's other
# needs — ureq, aws-sigv4, aws-credential-types, url — are already deps above.)
testcontainers = { version = "0.24", features = ["blocking"], optional = true }
testcontainers-modules = { version = "0.12", features = ["minio"], optional = true }
tempfile = { version = "3", optional = true }

[features]
# Exposes `catalog::test_support`, a MinIO/fake-gcs object-store harness used by
# this crate's object-store integration tests and by downstream crates (e.g.
# `server`) that want to run a catalog rooted in a real bucket.
test-support = ["dep:testcontainers", "dep:testcontainers-modules", "dep:tempfile"]

[dev-dependencies]
# Self-dependency to turn on `test-support` for this crate's own integration
# tests (so they can use `catalog::test_support`).
catalog = { path = ".", features = ["test-support"] }
# `test-util` exposes dispatch's single-operator test harness for the moved
# Parquet reader unit/integration tests.
dispatch = { path = "../dispatch", features = ["test-util"] }
parquet = { path = "../arrow-rs/parquet", default-features = false, features = ["arrow", "snap"] }
arrow-schema = { path = "../arrow-rs/arrow-schema" }
arrow = { path = "../arrow-rs/arrow", features = ["prettyprint"] }
tempfile = "3"
core_affinity = "0.8.3"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
# Parquet decompression/decoding microbenchmarks (`benches/decode.rs`).
# `harness = false`: we drive Criterion from our own `main` so one `Dispatch`
# (worker pool) + one synthetic parquet are built once and reused.
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[[bench]]
name = "decode"
harness = false
