[package]
name = "catalog"
version.workspace = true
edition.workspace = true
description = "The cross-datastore catalog: presents many named datastores to the planner as one Catalog, opening a per-datastore sub-transaction per query."

[dependencies]
planner = { workspace = true }
datastore = { workspace = true }
# `CREATE USER` routes to the metastore: the transaction stages requests and
# its commit applies them through `Metastore::create_user`.
metastore = { workspace = true }
# The staging queue a CREATE USER's dataflow pushes into, the same shape the
# delta datastore stages its creations with.
crossbeam-deque = { workspace = true }
dispatch = { workspace = true }
datastore-delta = { workspace = true }
# The `system` datastore the composite serves alongside the configured ones.
datastore-system = { workspace = true }
thiserror = { workspace = true }
# `Catalog::commit_transaction` is async: the composite awaits each touched
# datastore's own commit (each datastore self-offloads its blocking I/O).
async-trait = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
