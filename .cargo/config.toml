# kache (https://github.com/kunobi-ninja/kache) is a content-addressed rustc
# build cache. It wraps every rustc invocation, keying artifacts by a blake3 hash
# of the compiler version, crate source, dependencies, and normalized flags, so
# unchanged crates restore instantly instead of recompiling.
#
# It wraps rustc for every build here EXCEPT the release builds, which clear
# RUSTC_WRAPPER (an empty value overrides this setting) so shipped and optimized
# binaries are always compiled fresh, uncached:
#   - the release-binary CI job (.github/workflows/deploy.yml)
#   - the PGO recipes (pgo.just)
[build]
rustc-wrapper = "kache"
