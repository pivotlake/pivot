[project]
name = "ticks"
version = "0.1.0"
description = "Web UI for AMD IBS perf data — same view as ibs_annotate, served at localhost:3000."
requires-python = ">=3.10"
dependencies = ["click", "flask"]

[project.scripts]
ticks = "ticks.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
ticks = ["static/*"]
