site_name: Pivot
site_description: Analytical SQL over Delta tables on local storage or S3
repo_url: https://github.com/Epsio-Labs/pivotdb
repo_name: Epsio-Labs/pivotdb
edit_uri: edit/main/docs/

theme:
  name: mkdocs
  locale: en
  color_mode: auto
  user_color_mode_toggle: true
  nav_style: dark
  navigation_depth: 3
  highlightjs: true
  hljs_languages:
    - rust
    - sql
    - yaml

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - SQL: sql.md
  - Architecture: architecture.md
  - Rust API: https://epsio-labs.github.io/pivotdb/api/

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true

extra_css:
  - stylesheets/pivot.css

strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
