[package]
name = "benchmarks"
version.workspace = true
edition.workspace = true

# Deliberately links nothing from the engine. pivot-bench launches an external
# pivotdb-server and talks to it over pgwire, so the binary being measured (and
# profiled, for PGO) is exactly the artifact that ships. Adding an engine crate
# here would recreate a second compiled universe whose performance can silently
# diverge from the server's.

[dependencies]
clap = { workspace = true, features = ["env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync"] }
tokio-postgres = { workspace = true }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
flate2 = "1"
libc = { workspace = true }

[[bin]]
name = "pivot-bench"
path = "src/main.rs"
