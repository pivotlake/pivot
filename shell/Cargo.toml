[package]
name = "shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
catalog = { workspace = true }
datastore-delta = { workspace = true }
object-storage = { workspace = true }
dispatch = { workspace = true }
engine = { workspace = true }
metastore = { workspace = true }
planner = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }

rustyline = { version = "18", default-features = false }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
unicode-width = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Pull datastore-delta's `test_support` (MinIO / fake-gcs object-store harness)
# in for the bucket-backed session test; the library build keeps the plain dep.
datastore-delta = { workspace = true, features = ["test-support"] }
