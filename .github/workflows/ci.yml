name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      use_gcp_runner:
        description: "Run the check matrix on the self-hosted GCP runner (ci-runner-x86). On by default; uncheck to fall back to GitHub-hosted runners."
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  # Bypass the kache rustc wrapper (.cargo/config.toml): kache is only
  # installed on dev machines, and CI caching is handled by rust-cache.
  RUSTC_WRAPPER: ""

# The self-hosted runners live on the suspended `ci-runner-x86` GCP VM
# (pivot-ci / me-west1-c) and advertise the `gcp-builder` label. They are
# the default: every push and PR resumes the VM and routes the matrix there, and
# the box's own hourly suspend-if-unused cron suspends it again once no ci/deploy
# run is active. A manual workflow_dispatch can opt out (use_gcp_runner=false) to
# fall back to GitHub-hosted `ubuntu-latest` and skip the GCP jobs entirely.
jobs:
  # Resume the GCP VM so its runners come online before the matrix dispatches.
  # Jobs targeting `gcp-builder` queue until a runner connects, so we only need
  # to kick the VM awake here — no SSH/readiness wait required.
  start-ci:
    name: Start GCP runner
    # Resume on every push/PR; on manual dispatch, only when not opted out.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_gcp_runner }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/resume-gcp-runner
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

  # Derive the check×crate matrix from ci.sh so the crate/check lists live in
  # exactly one place (shared with local `./ci.sh` runs). Also resolve which
  # runner label the matrix should target, based on the opt-in input.
  matrix:
    name: Matrix
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.gen.outputs.cells }}
      runner: ${{ steps.runner.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: echo "cells=$(./ci.sh --matrix)" >> "$GITHUB_OUTPUT"
      - id: runner
        run: |
          # Default to the self-hosted box; only a dispatch opt-out routes back to
          # GitHub-hosted runners.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.use_gcp_runner }}" != "true" ]; then
            echo "label=ubuntu-latest" >> "$GITHUB_OUTPUT"
          else
            echo "label=gcp-builder" >> "$GITHUB_OUTPUT"
          fi

  # One job per (check, crate) cell — each runs the same ./ci.sh used locally,
  # but shows up separately in the UI (e.g. "clippy (planner)") so a failure
  # points at the exact check and crate.
  check:
    needs: [matrix, start-ci]
    # Run once the matrix is computed and the VM is up — but `start-ci` is
    # skipped on push/PR, so accept its skipped result too.
    if: ${{ always() && needs.matrix.result == 'success' && (needs.start-ci.result == 'success' || needs.start-ci.result == 'skipped') }}
    name: ${{ matrix.check }} (${{ matrix.crate }})
    runs-on: ${{ needs.matrix.outputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.cells) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # All crates share the root workspace's Cargo.lock and target/, so every
      # matrix cell caches the same workspace root.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # The datastore-delta/server object-store tests bring up MinIO + fake-gcs-server
      # via testcontainers. Cache the image tarballs (keyed on the pinned tags)
      # and docker-load them, so a cache hit never pulls from Docker Hub — faster
      # and free of anonymous pull rate limits. On a miss (first run, or a tag
      # bump) we pull once and save for next time.
      - name: Cache object-store test images
        if: matrix.check == 'test' && (matrix.crate == 'datastore-delta' || matrix.crate == 'server')
        uses: actions/cache@v4
        with:
          path: ~/docker-images
          key: docker-images-${{ hashFiles('.github/docker-images.txt') }}
      - name: Load or pull object-store test images
        if: matrix.check == 'test' && (matrix.crate == 'datastore-delta' || matrix.crate == 'server')
        run: |
          mkdir -p ~/docker-images
          grep -v '^[[:space:]]*#' .github/docker-images.txt | grep -v '^[[:space:]]*$' | while read -r image; do
            tar="$HOME/docker-images/$(echo "$image" | tr '/:' '__').tar"
            if [ -f "$tar" ]; then
              echo "load $image"; docker load -i "$tar"
            else
              echo "pull $image"; docker pull "$image" && docker save "$image" -o "$tar"
            fi
          done

      # ci-runner-x86 is Ubuntu 20.04 with gcc 9.4, which aws-lc-sys rejects
      # (GCC bug 95189). Build the C/C++ deps with clang there, like the
      # deploy and pages workflows do; GitHub-hosted runners have a newer,
      # unaffected gcc, so leave them on the default.
      - name: Use clang on the self-hosted runner
        if: runner.environment == 'self-hosted'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - run: ./ci.sh ${{ matrix.check }} ${{ matrix.crate }}

  debian-package:
    name: Debian package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Build package
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/debian/Dockerfile
          target: package
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=debian-${{ matrix.arch }}
          cache-to: type=gha,scope=debian-${{ matrix.arch }},mode=max

      - name: Inspect package
        run: packaging/debian/test-package.sh dist/pivot_*_${{ matrix.arch }}.deb

      - name: Test package installation
        run: packaging/debian/test-install.sh dist/pivot_*_${{ matrix.arch }}.deb

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pivot-deb-${{ matrix.arch }}
          path: dist/pivot_*_${{ matrix.arch }}.deb
          if-no-files-found: error

  # NOTE: we deliberately do NOT suspend the VM here. ci-runner-x86 runs an hourly
  # `suspend-if-unused` cron that suspends it only when no ci/deploy run is active
  # (across pivotdb + epsio). An unconditional stop job here would suspend the box
  # out from under a *concurrent* ci/deploy run still using it.
