name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      use_gcp_runner:
        description: "Run the check matrix on the self-hosted GCP runner. On by default; uncheck to fall back to GitHub-hosted runners."
        type: boolean
        default: true

# RUSTFLAGS is deliberately NOT set here: an env RUSTFLAGS replaces the
# [target.*] rustflags in .cargo/config.toml (the instruction-set floor), so
# ci.sh owns the default, which restates the floor alongside -D warnings.
env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

# The self-hosted runners live on a suspended GCP VM
# (named by the GCP_PROJECT / GCP_RUNNER_X86 / GCP_RUNNER_ZONE repository
# variables) and advertise the `gcp-builder` label. They are
# the default for pushes and for pull requests from branches of this
# repository: those resume the VM and route the matrix there, and the box's own
# hourly suspend-if-unused cron suspends it again once no ci/deploy run is
# active. Pull requests from forks run untrusted code, so they never touch the
# VM and run on GitHub-hosted `ubuntu-latest`. A manual workflow_dispatch can
# opt out (use_gcp_runner=false) to fall back to GitHub-hosted runners too.
jobs:
  # Resume the GCP VM so its runners come online before the matrix dispatches.
  # Jobs targeting `gcp-builder` queue until a runner connects, so we only need
  # to kick the VM awake here — no SSH/readiness wait required.
  start-ci:
    name: Start GCP runner
    # Resume on every push to this repository and every pull request from one
    # of its branches; on manual dispatch, only when not opted out. Never inside
    # a fork or for a fork's pull request: the VM and the credential that wakes
    # it are this repository's.
    if: >-
      ${{ github.repository == 'pivotlake/pivot'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
          && (github.event_name != 'workflow_dispatch' || inputs.use_gcp_runner) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/resume-gcp-runner
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project: ${{ vars.GCP_PROJECT }}
          instance: ${{ vars.GCP_RUNNER_X86 }}
          zone: ${{ vars.GCP_RUNNER_ZONE }}

  # Derive the check×crate matrix from ci.sh so the crate/check lists live in
  # exactly one place (shared with local `./ci.sh` runs). Also resolve which
  # runner label the matrix should target, based on the opt-in input.
  matrix:
    name: Matrix
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.gen.outputs.cells }}
      runner: ${{ steps.runner.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: echo "cells=$(./ci.sh --matrix)" >> "$GITHUB_OUTPUT"
      - id: runner
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # The self-hosted box runs only this repository's own code: a push to
          # it and a pull request from one of its branches run there, and a
          # dispatch can opt out. A pull request from a fork, and any workflow
          # running inside a fork, goes to a GitHub-hosted runner.
          if [ "${{ github.repository }}" != "pivotlake/pivot" ]; then
            echo "label=ubuntu-latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "$PR_HEAD_REPO" != "${{ github.repository }}" ]; then
            echo "label=ubuntu-latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.use_gcp_runner }}" != "true" ]; then
            echo "label=ubuntu-latest" >> "$GITHUB_OUTPUT"
          else
            echo "label=gcp-builder" >> "$GITHUB_OUTPUT"
          fi

  # One job per (check, crate) cell — each runs the same ./ci.sh used locally,
  # but shows up separately in the UI (e.g. "clippy (planner)") so a failure
  # points at the exact check and crate.
  check:
    needs: [matrix, start-ci]
    # Run once the matrix is computed and the VM is up — but `start-ci` is
    # skipped for fork pull requests and opted-out dispatches, so accept its
    # skipped result too.
    if: ${{ always() && needs.matrix.result == 'success' && (needs.start-ci.result == 'success' || needs.start-ci.result == 'skipped') }}
    name: ${{ matrix.check }} (${{ matrix.crate }})
    runs-on: ${{ needs.matrix.outputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.cells) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # All crates share the root workspace's Cargo.lock and target/, so every
      # matrix cell caches the same workspace root.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # The datastore-pivot/bin object-store tests bring up MinIO + fake-gcs-server
      # via testcontainers, and the datastore-iceberg tests MinIO + the REST fixture. Cache the image tarballs (keyed on the pinned tags)
      # and docker-load them, so a cache hit never pulls from Docker Hub — faster
      # and free of anonymous pull rate limits. On a miss (first run, or a tag
      # bump) we pull once and save for next time.
      - name: Cache object-store test images
        if: matrix.check == 'test' && (matrix.crate == 'datastore-pivot' || matrix.crate == 'datastore-iceberg' || matrix.crate == 'bin')
        uses: actions/cache@v4
        with:
          path: ~/docker-images
          key: docker-images-${{ hashFiles('.github/docker-images.txt') }}
      - name: Load or pull object-store test images
        if: matrix.check == 'test' && (matrix.crate == 'datastore-pivot' || matrix.crate == 'datastore-iceberg' || matrix.crate == 'bin')
        run: |
          mkdir -p ~/docker-images
          grep -v '^[[:space:]]*#' .github/docker-images.txt | grep -v '^[[:space:]]*$' | while read -r image; do
            tar="$HOME/docker-images/$(echo "$image" | tr '/:' '__').tar"
            if [ -f "$tar" ]; then
              echo "load $image"; docker load -i "$tar"
            else
              echo "pull $image"; docker pull "$image" && docker save "$image" -o "$tar"
            fi
          done

      # The x86 runner VM is Ubuntu 20.04 with gcc 9.4, which aws-lc-sys rejects
      # (GCC bug 95189). Build the C/C++ deps with clang there, like the
      # deploy and pages workflows do; GitHub-hosted runners have a newer,
      # unaffected gcc, so leave them on the default.
      - name: Use clang on the self-hosted runner
        if: runner.environment == 'self-hosted'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - run: ./ci.sh ${{ matrix.check }} ${{ matrix.crate }}

  # Keep branch protection independent of the dynamic check×crate matrix. This
  # job runs after every matrix cell and exposes one stable required check.
  summary:
    name: Summary
    needs: [matrix, check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI results
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Matrix generation finished with: $MATRIX_RESULT"
            exit 1
          fi
          if [ "$CHECK_RESULT" != "success" ]; then
            echo "CI check matrix finished with: $CHECK_RESULT"
            exit 1
          fi

  # NOTE: we deliberately do NOT suspend the VM here. It runs an hourly
  # `suspend-if-unused` cron that suspends it only when no ci/deploy run is active
  # (across every repo sharing the box). An unconditional stop job here would suspend it
  # out from under a *concurrent* ci/deploy run still using it.
