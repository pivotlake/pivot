name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.crate.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: dispatch
            workdir: dispatch
          - name: planner
            workdir: planner
          - name: duckdb-planner
            workdir: duckdb-planner
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate.workdir }}

      - name: Run tests
        working-directory: ${{ matrix.crate.workdir }}
        run: cargo test

  clippy:
    name: Clippy (${{ matrix.crate.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: dispatch
            workdir: dispatch
          - name: planner
            workdir: planner
          - name: duckdb-planner
            workdir: duckdb-planner
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate.workdir }}

      - name: Run clippy
        working-directory: ${{ matrix.crate.workdir }}
        run: cargo clippy --all-targets

  fmt:
    name: Format (${{ matrix.crate.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: dispatch
            workdir: dispatch
          - name: planner
            workdir: planner
          - name: duckdb-planner
            workdir: duckdb-planner
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: ${{ matrix.crate.workdir }}
        run: cargo fmt --check

  doc:
    name: Doc (${{ matrix.crate.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: dispatch
            workdir: dispatch
          - name: planner
            workdir: planner
          - name: duckdb-planner
            workdir: duckdb-planner
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate.workdir }}

      - name: Check public documentation
        working-directory: ${{ matrix.crate.workdir }}
        run: cargo doc --no-deps

      - name: Check internal documentation
        working-directory: ${{ matrix.crate.workdir }}
        run: cargo doc --document-private-items --no-deps
