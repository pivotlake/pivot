name: Perf A/B

# Compare pivotdb performance across two commits ("before" vs "after") on a
# dedicated AWS perf box. Builds a PGO binary per commit, times the ClickBench
# query set on the full single-hit dataset (pivot only, no DuckDB), and prints a
# per-query cold/hot diff. Fails the run if any query's hot time regresses.
#
# The perf box is a normally-STOPPED EC2 instance: this workflow starts it, runs
# on it, and stops it again (even on failure). Manual trigger only, so the box
# only ever wakes on demand.
#
# Required secrets:
#   PERF_AWS_ACCESS_KEY_ID / PERF_AWS_SECRET_ACCESS_KEY
#       AWS credentials allowed to ec2:DescribeInstances / StartInstances /
#       StopInstances on the perf box.
#   PERF_SSH_KEY
#       Private key authorised for the box's login user.
# Required repository variables:
#   PERF_AWS_INSTANCE_ID  — the EC2 instance id of the perf box. If empty, a
#                           stopped instance whose Name tag matches
#                           PERF_NAME_FILTER is discovered instead.
# Optional repository variables (defaults in parentheses):
#   PERF_AWS_REGION       (eu-central-1)
#   PERF_NAME_FILTER      (perf-*)     — Name-tag glob used when no instance id
#   PERF_SSH_USER         (ubuntu)
#   PERF_HITS_PATH        (~/hits)             — full dataset for measurement
#   PERF_PGO_SUBSET_PATH  (~/hits-pgo-subset)  — small subset for PGO profiling

on:
  workflow_dispatch:
    inputs:
      before_ref:
        description: "Baseline commit/ref ('before'). Empty = HEAD^ (the parent of the run's commit)."
        required: false
        default: ""
      after_ref:
        description: "Candidate commit/ref ('after'). Empty = the run's commit (HEAD)."
        required: false
        default: ""
      query:
        description: "Comma-separated query ids (e.g. 7,20). Empty = all."
        required: false
        default: ""
      iterations:
        description: "Iterations per query (iteration 1 = cold, rest = hot)."
        required: false
        default: "6"
      regression_pct:
        description: "Hot-time regression threshold (percent) that fails the run."
        required: false
        default: "5"

jobs:
  perf-ab:
    name: PGO A/B on perf box
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PERF_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PERF_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.PERF_AWS_REGION || 'eu-central-1' }}
      SSH_USER: ${{ vars.PERF_SSH_USER || 'ubuntu' }}
      HITS_PATH: ${{ vars.PERF_HITS_PATH || '~/hits' }}
      PGO_SUBSET_PATH: ${{ vars.PERF_PGO_SUBSET_PATH || '~/hits-pgo-subset' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve before/after commits
        env:
          BEFORE_REF: ${{ inputs.before_ref }}
          AFTER_REF: ${{ inputs.after_ref }}
        run: |
          set -euo pipefail
          # Custom refs may live on branches not in the shallow checkout; make
          # sure everything is fetched before resolving them.
          git fetch --all --no-tags --quiet || true
          after_sha=$(git rev-parse "${AFTER_REF:-HEAD}")
          before_sha=$(git rev-parse "${BEFORE_REF:-HEAD^}")
          if [ "$after_sha" = "$before_sha" ]; then
            echo "::error::before and after resolve to the same commit ($after_sha)"
            exit 1
          fi
          echo "AFTER_SHA=$after_sha"  >> "$GITHUB_ENV"
          echo "BEFORE_SHA=$before_sha" >> "$GITHUB_ENV"
          echo "after=$after_sha before=$before_sha"

      # Keep a copy of the harness from the run's commit, independent of which
      # commit is checked out into the tree later (the 'before' commit may
      # predate this script).
      - name: Stage A/B harness
        run: cp benchmarks/bench-ab.sh /tmp/bench-ab.sh

      - name: Start the perf box
        env:
          INSTANCE_ID: ${{ vars.PERF_AWS_INSTANCE_ID }}
          NAME_FILTER: ${{ vars.PERF_NAME_FILTER || 'perf-*' }}
        run: |
          set -euo pipefail
          id="$INSTANCE_ID"
          if [ -z "$id" ]; then
            # No explicit id: pick a box whose Name tag matches, preferring a
            # stopped one (never commandeer a running box unless it is the only
            # match and was named for perf).
            id=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=$NAME_FILTER" \
                        "Name=instance-state-name,Values=stopped" \
              --query 'Reservations[0].Instances[0].InstanceId' --output text)
            if [ "$id" = "None" ] || [ -z "$id" ]; then
              echo "::error::no stopped instance matching Name=$NAME_FILTER; set the PERF_AWS_INSTANCE_ID variable."
              exit 1
            fi
          fi
          echo "INSTANCE_ID=$id" >> "$GITHUB_ENV"
          echo "Using instance $id"

          state=$(aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Current state: $state"
          if [ "$state" != "running" ]; then
            aws ec2 start-instances --instance-ids "$id" >/dev/null
          fi
          aws ec2 wait instance-running --instance-ids "$id"

          ip=$(aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          if [ "$ip" = "None" ] || [ -z "$ip" ]; then
            echo "::error::instance $id has no public IP to ssh to."
            exit 1
          fi
          echo "PERF_IP=$ip" >> "$GITHUB_ENV"
          echo "Public IP: $ip"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PERF_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_perf
          chmod 600 ~/.ssh/id_perf
          cat >> ~/.ssh/config <<EOF
          Host perf
            HostName $PERF_IP
            User $SSH_USER
            IdentityFile ~/.ssh/id_perf
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 20
            ConnectTimeout 15
          EOF
          # Wait for sshd to accept connections after the fresh boot.
          for _ in $(seq 1 60); do
            if ssh perf true 2>/dev/null; then
              echo "SSH is up."; exit 0
            fi
            sleep 5
          done
          echo "::error::timed out waiting for SSH on $PERF_IP"
          exit 1

      - name: Refuse to run if anyone else is logged in
        run: |
          set -euo pipefail
          # `who` includes our own pty, so > 1 means a real user is present.
          count=$(ssh perf 'who | wc -l' | tr -d ' ')
          if [ "$count" -gt 1 ]; then
            echo "::error::another user is logged in on the perf box; refusing to run."
            ssh perf who
            exit 1
          fi
          echo "No other users logged in (who count: $count)."

      - name: Sync both source trees to the box
        run: |
          set -euo pipefail
          rsync_opts=(-az --delete \
            --exclude='.git' --exclude='target' \
            --exclude='target-pgogen' --exclude='target-pgouse')
          ssh perf 'mkdir -p ~/perf-ab'

          # AFTER first (already checked out at the run's commit), then BEFORE.
          git checkout --quiet --force "$AFTER_SHA"
          git submodule update --init --recursive --quiet
          rsync "${rsync_opts[@]}" -e "ssh -F $HOME/.ssh/config" ./ perf:perf-ab/after/

          git checkout --quiet --force "$BEFORE_SHA"
          git submodule update --init --recursive --quiet
          rsync "${rsync_opts[@]}" -e "ssh -F $HOME/.ssh/config" ./ perf:perf-ab/before/

          scp -F "$HOME/.ssh/config" /tmp/bench-ab.sh perf:/tmp/bench-ab.sh

      - name: Run A/B benchmark (detached, polled)
        env:
          QUERY: ${{ inputs.query }}
          ITERATIONS: ${{ inputs.iterations }}
          REGRESSION_PCT: ${{ inputs.regression_pct }}
        run: |
          set -euo pipefail
          query_arg=""
          [ -n "$QUERY" ] && query_arg="--query $QUERY"

          # Compose the launch command on the runner (all inputs interpolated
          # here) and ship it as a file, so the box just runs it. bench-ab.sh
          # expands the leading ~ in the paths against the box's own home.
          # Launch detached so the long build+bench survives ssh idle timeouts;
          # bench-ab.sh writes its PID and emits a sentinel on every exit path.
          cat > /tmp/launch.sh <<EOF
          rm -f /tmp/ab.log /tmp/ab-report.txt /tmp/bench-ab.pid
          setsid bash /tmp/bench-ab.sh \
            --before-dir '~/perf-ab/before' \
            --after-dir '~/perf-ab/after' \
            --source '$HITS_PATH' --pgo-subset '$PGO_SUBSET_PATH' \
            --iterations '$ITERATIONS' --regression-pct '$REGRESSION_PCT' \
            --report /tmp/ab-report.txt \
            --before-label '${BEFORE_SHA:0:12}' --after-label '${AFTER_SHA:0:12}' \
            $query_arg >/tmp/ab.log 2>&1 </dev/null &
          EOF
          scp -F "$HOME/.ssh/config" /tmp/launch.sh perf:/tmp/launch.sh
          ssh perf 'bash /tmp/launch.sh'
          echo "launched A/B run on the box"

          # Give the detached script a moment to write its PID and open the log
          # before the liveness check could false-positive on a missing PID file.
          sleep 10

          # Poll for completion. Each tick is ONE ssh round-trip that checks
          # liveness *before* grepping the sentinel — the ordering is what makes
          # it race-free: bench-ab.sh's EXIT trap writes the sentinel before the
          # process dies, so once the PID is confirmed gone the log is fully
          # flushed. Hence "pid alive" => keep waiting; "pid gone + sentinel" =>
          # done; "pid gone + no sentinel" => an untrappable kill (OOM/SIGKILL),
          # the only genuine failure. No sleep-and-hope needed.
          while true; do
            state=$(ssh perf '
              if kill -0 "$(cat /tmp/bench-ab.pid 2>/dev/null)" 2>/dev/null; then
                echo alive
              elif grep -q "BENCH-AB COMPLETE" /tmp/ab.log 2>/dev/null; then
                echo done
              else
                echo dead
              fi')
            case "$state" in
              done) break ;;
              dead)
                echo "::error::A/B process vanished without a sentinel (likely OOM/kill)."
                ssh perf 'tail -n 60 /tmp/ab.log' || true
                exit 1 ;;
              *)
                ssh perf 'tail -n 2 /tmp/ab.log' 2>/dev/null || true
                sleep 20 ;;
            esac
          done

          exit_line=$(ssh perf "grep -o 'BENCH-AB COMPLETE exit=[0-9]*' /tmp/ab.log | tail -1")
          code="${exit_line##*=}"
          echo "A/B exit code: ${code:-unknown}"

          scp -F "$HOME/.ssh/config" perf:/tmp/ab-report.txt ab-report.txt || true
          {
            echo "## pivotdb Perf A/B"
            echo ""
            echo "before \`${BEFORE_SHA:0:12}\` vs after \`${AFTER_SHA:0:12}\`"
            echo ""
            echo '```'
            cat ab-report.txt 2>/dev/null || echo "(no report captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${code:-1}" != "0" ]; then
            echo "::error::A/B run reported a hot regression or failed (exit=$code). See the job summary."
            exit 1
          fi
          echo "No hot regression past the threshold."

      - name: Stop the perf box
        if: ${{ always() && env.INSTANCE_ID != '' }}
        run: |
          set -euo pipefail
          echo "Stopping ${INSTANCE_ID}"
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID" >/dev/null || true
