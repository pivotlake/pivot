name: Perf A/B

# Compare pivotdb performance across two commits ("before" vs "after") on a
# dedicated AWS perf box. Builds a PGO pivot binary per commit and times each
# through the ClickBench pivot-parquet harness (per-query server restart + OS
# page-cache drop, the faithful ClickBench methodology) on the single-hit
# dataset. Prints a per-query cold/hot diff and fails the run if any query's hot
# time regresses. Optionally (run_duckdb) also times DuckDB (parquet,
# partitioned) once as a reference and scores the after build against it.
#
# The perf box is a normally-STOPPED EC2 instance: this workflow starts it, runs
# on it, and stops it again (even on failure). Manual trigger only, so the box
# only ever wakes on demand. The instance_type input picks the fleet: c8g*
# types run on the Graviton boxes (perf-1..5); every other offered type
# retypes the x86 box (perf-x86-1) to that microarchitecture (Zen 4, Milan,
# Cascade Lake, Ice Lake, Sapphire Rapids) - the architecture is baked into
# each box's AMI, so a type can never be switched across fleets, but any x86
# type is a legal retype of the x86 box.
#
# Required secrets:
#   PERF_AWS_ACCESS_KEY_ID / PERF_AWS_SECRET_ACCESS_KEY
#       AWS credentials allowed to ec2:DescribeInstances / StartInstances /
#       StopInstances (plus ec2:ModifyInstanceAttribute when the instance_type
#       input is used) on the perf box.
#   PERF_SSH_KEY
#       Private key authorised for the box's login user.
# The ClickBench harness fork (pivotlake/ClickBench_testing) is public, so it is
# checked out with the default token — no extra secret needed.
# Required repository variables:
#   PERF_AWS_INSTANCE_ID  — the EC2 instance id of the perf box. If empty, a
#                           stopped instance whose Name tag matches
#                           PERF_NAME_FILTER is discovered instead.
# Optional repository variables (defaults in parentheses):
#   PERF_AWS_REGION       (eu-central-1)
#   PERF_NAME_FILTER      (perf-*)     — Name-tag glob used when no instance id
#   PERF_SSH_USER         (ubuntu)
#   PERF_HITS_PATH        (~/hits)             — full dataset for measurement
#   PERF_PGO_SUBSET_PATH  (~/hits-pgo-subset)  — small subset for PGO profiling
#   PERF_DUCKDB_DATA      (empty)              — directory of partitioned
#                         hits_*.parquet, required only when run_duckdb is on

on:
  workflow_dispatch:
    inputs:
      before_ref:
        description: "Baseline commit/ref ('before'). Empty = HEAD^ (the parent of the run's commit)."
        required: false
        default: ""
      after_ref:
        description: "Candidate commit/ref ('after'). Empty = the run's commit (HEAD)."
        required: false
        default: ""
      query:
        description: "Comma-separated ClickBench query numbers, 0-based (e.g. 7,20). Empty = all 43."
        required: false
        default: ""
      iterations:
        description: "Tries per query (try 1 = cold, min of the rest = hot). ClickBench default is 3."
        required: false
        default: "3"
      regression_pct:
        description: "Hot-time regression threshold (percent) that fails the run."
        required: false
        default: "5"
      clickbench_ref:
        description: "Ref of the ClickBench fork (pivotlake/ClickBench_testing) providing the pivot-parquet harness."
        required: false
        default: "pivotdb-ab-server-bin"
      run_duckdb:
        description: "Also time DuckDB (parquet, partitioned) as a reference. Needs the PERF_DUCKDB_DATA variable."
        type: boolean
        default: false
      server_env:
        description: "Extra env for both server builds/runs, space-separated KEY=VALUE (e.g. PIVOT_DECOMPRESSED_CACHE=true PIVOT_RING_GB=20)."
        required: false
        default: ""
      instance_type:
        description: "EC2 instance type to run the perf box as. c8g* runs on the Graviton fleet (perf-1..5); every other type retypes the x86 box (perf-x86-1) to that microarchitecture: c7a = Zen 4, m6a = Milan (x86-64-v3), m5 = Cascade Lake (x86-64-v4), m6i = Ice Lake, m7i = Sapphire Rapids. Switched before starting if it differs; the box is restored to its family's default after the run."
        type: choice
        options:
          - c8g.4xlarge
          - c8g.metal-48xl
          - c7a.4xlarge
          - m6a.4xlarge
          - m5.4xlarge
          - m6i.4xlarge
          - m7i.4xlarge
        default: c8g.4xlarge
      profile:
        description: "Profile mode: instead of an A/B, build one PGO server from the after commit and record per-query engine stats, hot timings and perf profiles (see benchmarks/clickbench/profile-hot.sh)."
        type: boolean
        default: false
      callgraph_query:
        description: "Profile mode only: queries (0-based, comma-separated) to also profile with DWARF call graphs."
        required: false
        default: ""
      profile_workers:
        description: "Profile mode only: comma-separated worker counts to measure with (0 = the server's default)."
        required: false
        default: "0"
      profile_perf:
        description: "Profile mode only: also record perf profiles of the server (needs perf on the box)."
        type: boolean
        default: true
      profile_env_list:
        description: "Profile mode only: server environments to measure under, '|'-separated entries of space-separated KEY=VALUE pairs ('-' = none)."
        required: false
        default: "-"

jobs:
  perf-ab:
    name: PGO A/B on perf box
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PERF_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PERF_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.PERF_AWS_REGION || 'eu-central-1' }}
      SSH_USER: ${{ vars.PERF_SSH_USER || 'ubuntu' }}
      HITS_PATH: ${{ vars.PERF_HITS_PATH || '~/hits' }}
      PGO_SUBSET_PATH: ${{ vars.PERF_PGO_SUBSET_PATH || '~/hits-pgo-subset' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # The ClickBench pivot-parquet harness lives in the fork, not this repo;
      # check it out (pinned to clickbench_ref) so the harness version is
      # explicit rather than whatever happens to be on the box.
      - name: Check out ClickBench harness
        uses: actions/checkout@v4
        with:
          repository: pivotlake/ClickBench_testing
          ref: ${{ inputs.clickbench_ref }}
          path: clickbench-src

      - name: Resolve before/after commits
        env:
          BEFORE_REF: ${{ inputs.before_ref }}
          AFTER_REF: ${{ inputs.after_ref }}
        run: |
          set -euo pipefail
          # Custom refs may live on branches not in the shallow checkout; make
          # sure everything is fetched before resolving them.
          git fetch --all --no-tags --quiet || true
          after_sha=$(git rev-parse "${AFTER_REF:-HEAD}")
          before_sha=$(git rev-parse "${BEFORE_REF:-HEAD^}")
          if [ "$after_sha" = "$before_sha" ]; then
            echo "::error::before and after resolve to the same commit ($after_sha)"
            exit 1
          fi
          echo "AFTER_SHA=$after_sha"  >> "$GITHUB_ENV"
          echo "BEFORE_SHA=$before_sha" >> "$GITHUB_ENV"
          echo "after=$after_sha before=$before_sha"

      # Keep a copy of the harness from the run's commit, independent of which
      # commit is checked out into the tree later (the 'before' commit may
      # predate this script).
      - name: Stage A/B harness
        run: |
          cp benchmarks/clickbench/bench-ab.sh /tmp/bench-ab.sh
          cp benchmarks/clickbench/build-ab-servers.sh /tmp/build-ab-servers.sh
          cp benchmarks/clickbench/profile-hot.sh /tmp/profile-hot.sh

      - name: Start the perf box
        env:
          INSTANCE_ID: ${{ vars.PERF_AWS_INSTANCE_ID }}
          NAME_FILTER: ${{ vars.PERF_NAME_FILTER || 'perf-*' }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
        run: |
          set -euo pipefail
          # The CPU architecture is baked into a box's AMI, so the requested
          # type decides which box can serve the run: c8g* needs the arm64
          # fleet, every other offered type is an x86_64 retype of the x86 box.
          case "$INSTANCE_TYPE" in
            c8g*) ARCH=arm64 ;;
            *)    ARCH=x86_64 ;;
          esac

          id="$INSTANCE_ID"
          if [ -n "$id" ]; then
            pinned_arch=$(aws ec2 describe-instances --instance-ids "$id" \
              --query 'Reservations[0].Instances[0].Architecture' --output text)
            if [ "$pinned_arch" != "$ARCH" ]; then
              echo "PERF_AWS_INSTANCE_ID pins a $pinned_arch box but $INSTANCE_TYPE needs $ARCH; discovering by name instead."
              id=""
            fi
          fi
          if [ -z "$id" ]; then
            # No usable explicit id: pick a box whose Name tag and architecture
            # match, preferring a stopped one (never commandeer a running box
            # unless it is the only match and was named for perf).
            id=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=$NAME_FILTER" \
                        "Name=architecture,Values=$ARCH" \
                        "Name=instance-state-name,Values=stopped" \
              --query 'Reservations[0].Instances[0].InstanceId' --output text)
            if [ "$id" = "None" ] || [ -z "$id" ]; then
              echo "::error::no stopped $ARCH instance matching Name=$NAME_FILTER; set the PERF_AWS_INSTANCE_ID variable."
              exit 1
            fi
          fi
          echo "INSTANCE_ID=$id" >> "$GITHUB_ENV"
          echo "Using instance $id"

          state=$(aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Current state: $state"

          current_type=$(aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].InstanceType' --output text)
          if [ "$INSTANCE_TYPE" != "$current_type" ]; then
            # EC2 only allows a type change on a stopped instance; a box that is
            # already running is likely in use, so never stop it just for this.
            if [ "$state" != "stopped" ]; then
              echo "::error::instance type change ($current_type -> $INSTANCE_TYPE) requested but $id is $state, not stopped."
              exit 1
            fi
            echo "Changing instance type: $current_type -> $INSTANCE_TYPE"
            aws ec2 modify-instance-attribute --instance-id "$id" \
              --instance-type "Value=$INSTANCE_TYPE"
          else
            echo "Instance type: $current_type"
          fi

          if [ "$state" != "running" ]; then
            aws ec2 start-instances --instance-ids "$id" >/dev/null
          fi
          aws ec2 wait instance-running --instance-ids "$id"

          ip=$(aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          if [ "$ip" = "None" ] || [ -z "$ip" ]; then
            echo "::error::instance $id has no public IP to ssh to."
            exit 1
          fi
          echo "PERF_IP=$ip" >> "$GITHUB_ENV"
          echo "Public IP: $ip"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PERF_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_perf
          chmod 600 ~/.ssh/id_perf
          cat >> ~/.ssh/config <<EOF
          Host perf
            HostName $PERF_IP
            User $SSH_USER
            IdentityFile ~/.ssh/id_perf
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 20
            ConnectTimeout 15
          EOF
          # Wait for sshd to accept connections after the fresh boot.
          for _ in $(seq 1 60); do
            if ssh perf true 2>/dev/null; then
              echo "SSH is up."; exit 0
            fi
            sleep 5
          done
          echo "::error::timed out waiting for SSH on $PERF_IP"
          exit 1

      - name: Refuse to run if anyone else is logged in
        run: |
          set -euo pipefail
          # `who` includes our own pty, so > 1 means a real user is present.
          count=$(ssh perf 'who | wc -l' | tr -d ' ')
          if [ "$count" -gt 1 ]; then
            echo "::error::another user is logged in on the perf box; refusing to run."
            ssh perf who
            exit 1
          fi
          echo "No other users logged in (who count: $count)."

      - name: Ensure the box has the build deps
        run: |
          set -euo pipefail
          # The instrumented PGO build links with lld: instrumentation grows the
          # text past the aarch64 128MB branch range and GNU ld fails with
          # relocation overflows. The tpch A/B AMI bakes lld in, but this box is
          # long-lived and predates that, so install it rather than assume it.
          ssh perf 'command -v ld.lld >/dev/null \
            || sudo DEBIAN_FRONTEND=noninteractive apt-get install -qy lld'

      - name: Sync both source trees to the box
        run: |
          set -euo pipefail
          # --checksum --no-times: a fresh git checkout on the runner stamps
          # every file with the current time. With plain -a, rsync's -t would
          # force the box files' mtimes to match those new source mtimes even
          # when --checksum finds the content identical (a metadata-only update),
          # so cargo would still rebuild arrow+duckdb from scratch every run.
          # --checksum picks transfers by content hash, and --no-times stops the
          # mtime from being touched on unchanged files, so their mtimes stay
          # stable and cargo reuses the persistent target-pgo* artifacts between
          # runs on the same machine. (Verified: -t alone re-stamps mtimes even
          # under --checksum; --no-times is what actually preserves them.)
          #
          # clickbench-src is a sibling checkout inside the workspace, not part
          # of the pivot tree — exclude it here and sync it on its own below.
          rsync_opts=(-az --checksum --no-times --delete \
            --exclude='.git' --exclude='target' \
            --exclude='target-pgogen' --exclude='target-pgouse' \
            --exclude='clickbench-src')
          ssh perf 'mkdir -p ~/perf-ab'

          # The PGO recipes build at the shipped instruction floor
          # (x86-64-v3 / the aarch64 feature list, see pgo.just), so warm
          # target dirs are valid on every instance type the box serves and
          # survive a CPU change.

          # AFTER first (already checked out at the run's commit), then BEFORE.
          git checkout --quiet --force "$AFTER_SHA"
          git submodule update --init --recursive --quiet
          rsync "${rsync_opts[@]}" -e "ssh -F $HOME/.ssh/config" ./ perf:perf-ab/after/

          git checkout --quiet --force "$BEFORE_SHA"
          git submodule update --init --recursive --quiet
          rsync "${rsync_opts[@]}" -e "ssh -F $HOME/.ssh/config" ./ perf:perf-ab/before/

          # The ClickBench harness (whole repo — the adapter references ../lib).
          rsync -az --delete --exclude='.git' \
            -e "ssh -F $HOME/.ssh/config" clickbench-src/ perf:perf-ab/ClickBench/

          scp -F "$HOME/.ssh/config" /tmp/bench-ab.sh perf:/tmp/bench-ab.sh
          scp -F "$HOME/.ssh/config" /tmp/build-ab-servers.sh perf:/tmp/build-ab-servers.sh
          scp -F "$HOME/.ssh/config" /tmp/profile-hot.sh perf:/tmp/profile-hot.sh

      - name: Run A/B benchmark (detached, polled)
        if: ${{ !inputs.profile }}
        env:
          QUERY: ${{ inputs.query }}
          ITERATIONS: ${{ inputs.iterations }}
          REGRESSION_PCT: ${{ inputs.regression_pct }}
          RUN_DUCKDB: ${{ inputs.run_duckdb }}
          DUCKDB_DATA: ${{ vars.PERF_DUCKDB_DATA }}
          SERVER_ENV: ${{ inputs.server_env }}
        run: |
          set -euo pipefail
          query_arg=""
          [ -n "$QUERY" ] && query_arg="--query $QUERY"

          # Single-quote so a multi-pair value reaches bench-ab.sh as one arg.
          env_arg=""
          [ -n "$SERVER_ENV" ] && env_arg="--server-env '$SERVER_ENV'"

          duckdb_arg=""
          if [ "$RUN_DUCKDB" = "true" ]; then
            if [ -z "$DUCKDB_DATA" ]; then
              echo "::error::run_duckdb is on but the PERF_DUCKDB_DATA variable (partitioned hits_*.parquet dir) is unset."
              exit 1
            fi
            duckdb_arg="--duckdb-data $DUCKDB_DATA"
          fi

          # Compose the launch command on the runner (all inputs interpolated
          # here) and ship it as a file, so the box just runs it. bench-ab.sh
          # expands the leading ~ in the paths against the box's own home.
          # Launch detached so the long build+bench survives ssh idle timeouts;
          # bench-ab.sh writes its PID and emits a sentinel on every exit path.
          # Build both servers first, then measure them. bench-ab.sh no longer
          # builds, so the phase is: build -> hand the two binaries over. The
          # outer shell owns /tmp/bench-ab.pid and emits the sentinel the poll
          # below watches for, so a failure during the *build* ends the poll
          # too instead of leaving it spinning on a run that never started.
          cat > /tmp/launch.sh <<EOF
          rm -f /tmp/ab.log /tmp/ab-report.txt /tmp/bench-ab.pid /tmp/ab-bins.env
          setsid bash -c '
            echo \$\$ >/tmp/bench-ab.pid
            trap '"'"'echo "=== BENCH-AB COMPLETE exit=\$? ==="'"'"' EXIT
            set -e
            bash /tmp/build-ab-servers.sh \
              --before-dir ~/perf-ab/before \
              --after-dir ~/perf-ab/after \
              --pgo-subset '$PGO_SUBSET_PATH' >/tmp/ab-bins.env
            . /tmp/ab-bins.env
            PID_FILE=/tmp/bench-ab-inner.pid bash /tmp/bench-ab.sh \
              --before-bin "\$BEFORE_BIN" \
              --after-bin "\$AFTER_BIN" \
              --clickbench-dir ~/perf-ab/ClickBench \
              --source '$HITS_PATH' --pgo-subset '$PGO_SUBSET_PATH' \
              --iterations '$ITERATIONS' --regression-pct '$REGRESSION_PCT' \
              --report /tmp/ab-report.txt \
              --before-label '${BEFORE_SHA:0:12}' --after-label '${AFTER_SHA:0:12}' \
              $query_arg $duckdb_arg $env_arg
          ' >/tmp/ab.log 2>&1 </dev/null &
          EOF
          scp -F "$HOME/.ssh/config" /tmp/launch.sh perf:/tmp/launch.sh
          ssh perf 'bash /tmp/launch.sh'
          echo "launched A/B run on the box"

          # Give the detached script a moment to write its PID and open the log
          # before the liveness check could false-positive on a missing PID file.
          sleep 10

          # Poll for completion. Each tick is ONE ssh round-trip that checks
          # liveness *before* grepping the sentinel — the ordering is what makes
          # it race-free: bench-ab.sh's EXIT trap writes the sentinel before the
          # process dies, so once the PID is confirmed gone the log is fully
          # flushed. Hence "pid alive" => keep waiting; "pid gone + sentinel" =>
          # done; "pid gone + no sentinel" => an untrappable kill (OOM/SIGKILL),
          # the only genuine failure. No sleep-and-hope needed.
          prev_id=""
          while true; do
            state=$(ssh perf '
              if kill -0 "$(cat /tmp/bench-ab.pid 2>/dev/null)" 2>/dev/null; then
                echo alive
              elif grep -q "BENCH-AB COMPLETE" /tmp/ab.log 2>/dev/null; then
                echo done
              else
                echo dead
              fi')
            case "$state" in
              done) break ;;
              dead)
                echo "::error::A/B process vanished without a sentinel (likely OOM/kill)."
                ssh perf 'tail -n 60 /tmp/ab.log' || true
                exit 1 ;;
              *)
                # Tail whichever file is actually moving: ab.log during the
                # builds, then the active side's harness output once timing
                # starts, since run_harness redirects there and ab.log stops
                # growing for that whole phase.
                #
                # Skip a tick only when that file has not grown, keying on its
                # name and size rather than on the text. Output that repeats is
                # still progress: a query timing the same twice, or the run of
                # nulls a failing side produces, would compare equal and be
                # hidden exactly when it most needs watching.
                cur=$(ssh perf 'f=$(ls -t /tmp/ab.log /tmp/ab-before.out /tmp/ab-after.out 2>/dev/null | head -1)
                                [ -n "$f" ] || exit 0
                                printf "%s %s\n" "$f" "$(stat -c %s "$f")"
                                tail -n 3 "$f"' 2>/dev/null || true)
                cur_id=$(printf '%s\n' "$cur" | head -1)
                if [ -n "$cur_id" ] && [ "$cur_id" != "$prev_id" ]; then
                  printf '%s\n' "$cur" | tail -n +2
                fi
                prev_id=$cur_id
                sleep 20 ;;
            esac
          done

          exit_line=$(ssh perf "grep -o 'BENCH-AB COMPLETE exit=[0-9]*' /tmp/ab.log | tail -1")
          code="${exit_line##*=}"
          echo "A/B exit code: ${code:-unknown}"

          # Pull the report and the full box-side log back so they can be
          # attached as an artifact (the box's /tmp is wiped when it stops).
          scp -F "$HOME/.ssh/config" perf:/tmp/ab-report.txt ab-report.txt || true
          scp -F "$HOME/.ssh/config" perf:/tmp/ab.log ab-full.log || true
          # The per-side harness output. A query that errors shows up in the
          # report only as a null timing, and the reason it failed is in here,
          # so without these a failed run is undiagnosable after the box stops.
          scp -F "$HOME/.ssh/config" perf:/tmp/ab-before.out ab-before.out || true
          scp -F "$HOME/.ssh/config" perf:/tmp/ab-after.out ab-after.out || true
          {
            echo "## pivotdb Perf A/B"
            echo ""
            echo "before \`${BEFORE_SHA:0:12}\` vs after \`${AFTER_SHA:0:12}\`"
            echo ""
            echo '```'
            cat ab-report.txt 2>/dev/null || echo "(no report captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${code:-1}" != "0" ]; then
            echo "::error::A/B run reported a hot regression or failed (exit=$code). See the job summary."
            exit 1
          fi
          echo "No hot regression past the threshold."

      - name: Run the profile (detached, polled)
        if: ${{ inputs.profile }}
        env:
          QUERY: ${{ inputs.query }}
          CALLGRAPH_QUERY: ${{ inputs.callgraph_query }}
          PROFILE_WORKERS: ${{ inputs.profile_workers }}
          PROFILE_PERF: ${{ inputs.profile_perf }}
          PROFILE_ENV_LIST: ${{ inputs.profile_env_list }}
          RUNS: ${{ inputs.iterations }}
        run: |
          set -euo pipefail
          ssh perf 'command -v perf >/dev/null \
            || sudo DEBIAN_FRONTEND=noninteractive apt-get install -qy linux-tools-common linux-tools-aws \
            || sudo DEBIAN_FRONTEND=noninteractive apt-get install -qy linux-tools-common "linux-tools-$(uname -r)"'
          ssh perf 'perf --version'
          query_arg=""
          [ -n "$QUERY" ] && query_arg="--query $QUERY"
          cg_arg=""
          [ -n "$CALLGRAPH_QUERY" ] && cg_arg="--callgraph-query $CALLGRAPH_QUERY"
          [ "$PROFILE_PERF" = "true" ] || cg_arg="$cg_arg --no-perf"
          # The env list carries '|' and '=' that the launch command's quoting
          # cannot, so it travels as a file.
          printf '%s\n' "${PROFILE_ENV_LIST:--}" > /tmp/profile-env-list.txt
          scp -F "$HOME/.ssh/config" /tmp/profile-env-list.txt perf:/tmp/profile-env-list.txt
          cat > /tmp/launch.sh <<EOF
          rm -rf /tmp/profile /tmp/profile.log /tmp/profile.pid
          setsid bash -c '
            echo \$\$ >/tmp/profile.pid
            trap '"'"'echo "=== PROFILE COMPLETE exit=\$? ==="'"'"' EXIT
            bash /tmp/profile-hot.sh \
              --tree ~/perf-ab/after \
              --clickbench-dir ~/perf-ab/ClickBench \
              --source '$HITS_PATH' --pgo-subset '$PGO_SUBSET_PATH' \
              --out /tmp/profile --runs '$RUNS' --workers-list '${PROFILE_WORKERS:-0}' \
              --env-list-file /tmp/profile-env-list.txt $query_arg $cg_arg
          ' >/tmp/profile.log 2>&1 </dev/null &
          EOF
          scp -F "$HOME/.ssh/config" /tmp/launch.sh perf:/tmp/launch.sh
          ssh perf 'bash /tmp/launch.sh'
          echo "launched the profile run on the box"
          sleep 10
          prev=""
          while true; do
            state=$(ssh perf '
              if kill -0 "$(cat /tmp/profile.pid 2>/dev/null)" 2>/dev/null; then
                echo alive
              elif grep -q "PROFILE COMPLETE" /tmp/profile.log 2>/dev/null; then
                echo done
              else
                echo dead
              fi')
            case "$state" in
              done) break ;;
              dead)
                echo "::error::the profile process vanished without a sentinel."
                ssh perf 'tail -n 60 /tmp/profile.log' || true
                exit 1 ;;
              *)
                cur=$(ssh perf 'tail -n 3 /tmp/profile.log' 2>/dev/null || true)
                if [ "$cur" != "$prev" ]; then printf '%s\n' "$cur"; fi
                prev=$cur
                sleep 20 ;;
            esac
          done
          ssh perf 'tail -n 40 /tmp/profile.log' || true
          ssh perf 'cd /tmp && tar -czf /tmp/profile.tgz $(ls -d profile profile.log 2>/dev/null)'
          scp -F "$HOME/.ssh/config" perf:/tmp/profile.tgz profile.tgz
          mkdir -p profile-out && tar -C profile-out -xzf profile.tgz
          exit_line=$(grep -o 'PROFILE COMPLETE exit=[0-9]*' profile-out/profile.log | tail -1)
          code="${exit_line##*=}"
          echo "profile exit code: ${code:-unknown}"
          {
            echo "## pivotdb hot-run profile"
            echo '```'
            for d in profile-out/profile/e*; do
              echo "=== $d"
              cat "$d/machine.txt" 2>/dev/null || true
              echo
              cat "$d/stats.txt" 2>/dev/null || echo "(no stats captured)"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${code:-1}" = "0" ]

      # Downloadable copy of the report + full box log, so results survive
      # beyond the job summary and are available even when the run failed.
      - name: Upload A/B report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-ab-report
          path: |
            ab-report.txt
            ab-full.log
            ab-before.out
            ab-after.out
            profile-out
          if-no-files-found: ignore

      - name: Stop the perf box
        if: ${{ always() && env.INSTANCE_ID != '' }}
        run: |
          set -euo pipefail
          echo "Stopping ${INSTANCE_ID}"
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID" >/dev/null || true

          # Always park the box as its family's 4xlarge, so a run on a bigger
          # type never leaves it behind for whoever starts the box next. The
          # family follows the box's architecture. The type can only be changed
          # once the instance has fully stopped.
          arch=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].Architecture' --output text)
          case "$arch" in
            x86_64) RESTORE_TYPE=c7a.4xlarge ;;
            *)      RESTORE_TYPE=c8g.4xlarge ;;
          esac
          current_type=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].InstanceType' --output text)
          if [ "$current_type" != "$RESTORE_TYPE" ]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            echo "Restoring instance type: $current_type -> $RESTORE_TYPE"
            aws ec2 modify-instance-attribute --instance-id "$INSTANCE_ID" \
              --instance-type "Value=$RESTORE_TYPE"
          fi
