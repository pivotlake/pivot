name: TPC-H A/B

# Compare pivotdb performance across two commits ("before" vs "after") on the
# normalized TPC-H suite, on a FRESHLY LAUNCHED instance-store machine that is
# terminated when the run ends. The box does all the work itself
# (benchmarks/tpch/bench-tpch-ab.sh): checkouts from an AMI-baked repo clone,
# per-table dataset sync from S3 overlapping the builds, PGO (or plain
# release) builds per side with warm cargo caches restored from S3, then cold
# power runs: per side and pass, one pivot-bench process streams the whole
# suite, each query once, 500ms apart, caches dropped only before the stream.
# Cold is the per-query min across passes; a cold regression past the
# threshold, or an output mismatch between the sides, fails the run. With
# run_duckdb, DuckDB streams the suite the same way through
# benchmarks/tpch/run-duckdb.sh as a reference column that never gates.
#
# Manual trigger only.
#
# One-time setup: bake the AMI with benchmarks/tpch/bake-tpch-ab-ami.sh and set
# the TPCH_AB_AMI_ID variable to its output.
#
# Required secrets (shared with perf-ab):
#   PERF_AWS_ACCESS_KEY_ID / PERF_AWS_SECRET_ACCESS_KEY
#       AWS credentials allowed to ec2:RunInstances / DescribeInstances /
#       TerminateInstances (and to pass TPCH_AB_INSTANCE_PROFILE).
#   TPCH_AB_SSH_KEY
#       Private key matching TPCH_AB_KEY_NAME (the box authorizes that key
#       pair at launch). Falls back to PERF_SSH_KEY when unset.
# Required repository variables:
#   TPCH_AB_AMI_ID            - AMI baked by bake-tpch-ab-ami.sh
#   TPCH_AB_INSTANCE_PROFILE  - instance profile name with read access to the
#                               dataset bucket and read/write to the cache
#                               prefix
# Optional repository variables (defaults in parentheses):
#   TPCH_AB_REGION        (eu-central-1)
#   TPCH_AB_INSTANCE_TYPE (c8gd.4xlarge) - instance-store NVMe required; keep
#                         one type so timings stay comparable across runs
#   TPCH_AB_KEY_NAME      - EC2 key pair matching PERF_SSH_KEY
#   TPCH_AB_SUBNET_ID / TPCH_AB_SECURITY_GROUP  (account defaults) - the
#                         security group must allow ssh from the runner
#   TPCH_AB_DATA_BUCKET_NORM - the normalized dataset, one
#                         directory per table under each scale prefix
#   TPCH_AB_CACHE_PREFIX  - unset or empty string
#                         disables warm caches entirely; shared with the flat
#                         job, since the cached artifacts are whole-workspace
#                         cargo target dirs and identical either way

on:
  workflow_dispatch:
    inputs:
      before_ref:
        description: "Baseline commit/ref ('before'). Empty = HEAD^ (the parent of the run's commit)."
        required: false
        default: ""
      after_ref:
        description: "Candidate commit/ref ('after'). Empty = the run's commit (HEAD)."
        required: false
        default: ""
      build_mode:
        description: "pgo = full PGO per side (the decision tool). release = plain cargo --release (fast iteration; numbers carry alignment noise)."
        type: choice
        options: [pgo, release]
        default: pgo
      query:
        description: "Comma-separated suite query ids (e.g. q06,q12). Empty = all."
        required: false
        default: ""
      passes:
        description: "Power streams per side; cold is the per-query min across passes."
        required: false
        default: "2"
      regression_pct:
        description: "Cold-time regression threshold (percent) that fails the run."
        required: false
        default: "5"
      run_duckdb:
        description: "Also stream the suite through DuckDB (run-duckdb.sh) as a reference column (never gates)."
        type: boolean
        default: false
      bench_env:
        description: "Extra env for both sides' runs, space-separated KEY=VALUE (e.g. PIVOT_COMPRESSED_CACHE_PCT=70)."
        required: false
        default: ""

jobs:
  tpch-ab:
    name: TPC-H A/B on a fresh box
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PERF_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PERF_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.TPCH_AB_REGION || 'eu-central-1' }}
      DATA_BUCKET: ${{ vars.TPCH_AB_DATA_BUCKET_NORM }}
      CACHE_PREFIX: ${{ vars.TPCH_AB_CACHE_PREFIX }}

    steps:
      # No submodules: the box resolves sources from its baked clone. The full
      # history is still needed to resolve arbitrary before/after refs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve before/after commits
        env:
          BEFORE_REF: ${{ inputs.before_ref }}
          AFTER_REF: ${{ inputs.after_ref }}
        run: |
          set -euo pipefail
          git fetch --all --no-tags --quiet || true
          after_sha=$(git rev-parse "${AFTER_REF:-HEAD}")
          before_sha=$(git rev-parse "${BEFORE_REF:-HEAD^}")
          if [ "$after_sha" = "$before_sha" ]; then
            echo "::error::before and after resolve to the same commit ($after_sha)"
            exit 1
          fi
          echo "AFTER_SHA=$after_sha"  >> "$GITHUB_ENV"
          echo "BEFORE_SHA=$before_sha" >> "$GITHUB_ENV"
          echo "after=$after_sha before=$before_sha"

      - name: Launch a fresh box
        env:
          AMI_ID: ${{ vars.TPCH_AB_AMI_ID }}
          INSTANCE_TYPE: ${{ vars.TPCH_AB_INSTANCE_TYPE || 'c8gd.4xlarge' }}
          KEY_NAME: ${{ vars.TPCH_AB_KEY_NAME }}
          INSTANCE_PROFILE: ${{ vars.TPCH_AB_INSTANCE_PROFILE }}
          SUBNET_ID: ${{ vars.TPCH_AB_SUBNET_ID }}
          SECURITY_GROUP: ${{ vars.TPCH_AB_SECURITY_GROUP }}
        run: |
          set -euo pipefail
          [ -n "$AMI_ID" ] || { echo "::error::TPCH_AB_AMI_ID is unset; bake one with benchmarks/tpch/bake-tpch-ab-ami.sh"; exit 1; }
          [ -n "$INSTANCE_PROFILE" ] || { echo "::error::TPCH_AB_INSTANCE_PROFILE is unset"; exit 1; }
          [ -n "$KEY_NAME" ] || { echo "::error::TPCH_AB_KEY_NAME is unset; set it to an EC2 key pair whose private half is in PERF_SSH_KEY"; exit 1; }

          # The tag stays under the tpch-ab-* prefix the CI user may
          # terminate; a tag outside it would leak the box.
          args=(--image-id "$AMI_ID" --instance-type "$INSTANCE_TYPE" --count 1
                --key-name "$KEY_NAME"
                --iam-instance-profile "Name=$INSTANCE_PROFILE"
                --instance-initiated-shutdown-behavior terminate
                --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=tpch-ab-norm-${GITHUB_RUN_ID}}]")
          [ -n "$SUBNET_ID" ] && args+=(--subnet-id "$SUBNET_ID")
          [ -n "$SECURITY_GROUP" ] && args+=(--security-group-ids "$SECURITY_GROUP")

          # Belt-and-braces leak guard: the instance halts itself after 3h and
          # a halt terminates it (shutdown behavior above), so a runner that
          # dies mid-job cannot leave the box running forever.
          id=$(aws ec2 run-instances "${args[@]}" \
            --user-data '#!/bin/bash
          shutdown -h +180' \
            --query 'Instances[0].InstanceId' --output text)
          echo "INSTANCE_ID=$id" >> "$GITHUB_ENV"
          echo "Launched $id"

          aws ec2 wait instance-running --instance-ids "$id"
          ip=$(aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          if [ "$ip" = "None" ] || [ -z "$ip" ]; then
            echo "::error::instance $id has no public IP to ssh to."
            exit 1
          fi
          echo "BOX_IP=$ip" >> "$GITHUB_ENV"
          echo "Public IP: $ip"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TPCH_AB_SSH_KEY || secrets.PERF_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ab
          chmod 600 ~/.ssh/id_ab
          cat >> ~/.ssh/config <<EOF
          Host box
            HostName $BOX_IP
            User ubuntu
            IdentityFile ~/.ssh/id_ab
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 20
            ConnectTimeout 15
          EOF
          for _ in $(seq 1 60); do
            if ssh box true 2>/dev/null; then
              echo "SSH is up."; exit 0
            fi
            sleep 5
          done
          echo "::error::timed out waiting for SSH on $BOX_IP"
          ssh -v box true 2>&1 | tail -8 || true
          exit 1

      - name: Run A/B (detached, polled)
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          QUERY: ${{ inputs.query }}
          PASSES: ${{ inputs.passes }}
          REGRESSION_PCT: ${{ inputs.regression_pct }}
          RUN_DUCKDB: ${{ inputs.run_duckdb }}
          BENCH_ENV: ${{ inputs.bench_env }}
          # Ephemeral, repo-read token: lets the box fetch the two commits into
          # its baked clone. It expires when the job ends and the box is
          # terminated regardless.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Ship the harness, its shared library and the DuckDB runner from
          # the run's commit (the 'before' commit may predate them). The
          # harness finds both siblings by relative path, so all three land in
          # the same /tmp directory.
          scp -F "$HOME/.ssh/config" benchmarks/tpch/bench-tpch-ab.sh box:/tmp/bench-tpch-ab.sh
          scp -F "$HOME/.ssh/config" benchmarks/lib/bench-ab-common.sh box:/tmp/bench-ab-common.sh
          scp -F "$HOME/.ssh/config" benchmarks/tpch/run-duckdb.sh box:/tmp/run-duckdb.sh

          query_arg=""
          [ -n "$QUERY" ] && query_arg="--query '$QUERY'"
          duckdb_arg=""
          [ "$RUN_DUCKDB" = "true" ] && duckdb_arg="--duckdb"
          env_arg=""
          [ -n "$BENCH_ENV" ] && env_arg="--bench-env '$BENCH_ENV'"

          cat > /tmp/launch.sh <<EOF
          rm -f /tmp/ab.log /tmp/ab-report.txt /tmp/bench-tpch-ab.pid
          setsid bash /tmp/bench-tpch-ab.sh \
            --mirror /opt/pivotdb \
            --repo-url 'https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git' \
            --before '$BEFORE_SHA' --after '$AFTER_SHA' \
            --before-label '${BEFORE_SHA:0:12}' --after-label '${AFTER_SHA:0:12}' \
            --data-bucket '$DATA_BUCKET' --cache-prefix '$CACHE_PREFIX' \
            --mode '$BUILD_MODE' --passes '$PASSES' \
            --regression-pct '$REGRESSION_PCT' \
            --report /tmp/ab-report.txt \
            $query_arg $duckdb_arg $env_arg >/tmp/ab.log 2>&1 </dev/null &
          EOF
          scp -F "$HOME/.ssh/config" /tmp/launch.sh box:/tmp/launch.sh
          ssh box 'bash /tmp/launch.sh && rm -f /tmp/launch.sh'
          echo "launched A/B run on the box"
          sleep 10

          # Poll: liveness first, then the sentinel; the EXIT trap writes the
          # sentinel before the process dies, so "pid gone + no sentinel" only
          # means an untrappable kill.
          while true; do
            state=$(ssh box '
              if kill -0 "$(cat /tmp/bench-tpch-ab.pid 2>/dev/null)" 2>/dev/null; then
                echo alive
              elif grep -q "BENCH-TPCH-AB COMPLETE" /tmp/ab.log 2>/dev/null; then
                echo done
              else
                echo dead
              fi')
            case "$state" in
              done) break ;;
              dead)
                echo "::error::A/B process vanished without a sentinel (likely OOM/kill)."
                ssh box 'tail -n 60 /tmp/ab.log' || true
                exit 1 ;;
              *)
                ssh box 'tail -n 2 /tmp/ab.log' 2>/dev/null || true
                sleep 20 ;;
            esac
          done

          exit_line=$(ssh box "grep -o 'BENCH-TPCH-AB COMPLETE exit=[0-9]*' /tmp/ab.log | tail -1")
          code="${exit_line##*=}"
          echo "A/B exit code: ${code:-unknown}"

          scp -F "$HOME/.ssh/config" box:/tmp/ab-report.txt ab-report.txt || true
          scp -F "$HOME/.ssh/config" box:/tmp/ab.log ab-full.log || true
          {
            echo "## pivotdb TPC-H A/B ($BUILD_MODE)"
            echo ""
            echo "before \`${BEFORE_SHA:0:12}\` vs after \`${AFTER_SHA:0:12}\`"
            echo ""
            echo '```'
            cat ab-report.txt 2>/dev/null || echo "(no report captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${code:-1}" != "0" ]; then
            echo "::error::A/B run reported a cold regression, an output mismatch, or failed (exit=$code). See the job summary."
            exit 1
          fi
          echo "No cold regression past the threshold."

      - name: Upload A/B report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tpch-ab-report
          path: |
            ab-report.txt
            ab-full.log
          if-no-files-found: ignore

      - name: Terminate the box
        if: ${{ always() && env.INSTANCE_ID != '' }}
        run: |
          set -euo pipefail
          echo "Terminating ${INSTANCE_ID}"
          aws ec2 terminate-instances --instance-ids "$INSTANCE_ID" >/dev/null || true
