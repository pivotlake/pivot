name: Deploy Server

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "Destination GCS bucket (overrides the DEPLOY_GCS_BUCKET repo variable). e.g. gs://my-bucket/path"
        required: false
        default: ""
      build_x86_64:
        description: "Build & deploy the x86_64 binary"
        type: boolean
        default: true
      build_aarch64:
        description: "Build & deploy the aarch64 binary"
        type: boolean
        default: true
      use_gcp_runner:
        description: "Build the x86_64 binary on the self-hosted GCP runner (ci-runner-x86). On by default; uncheck to use a GitHub-hosted runner. The aarch64 build always uses a hosted arm64 runner."
        type: boolean
        default: true

# Required secrets:
#   GCP_SA_KEY  — JSON key for a service account with objectAdmin on the bucket.
#                 For use_gcp_runner it also needs to resume ci-runner-x86
#                 (instance-scoped compute.instanceAdmin.v1 is enough).
# Required repository variables (unless overridden via the `bucket` input):
#   DEPLOY_GCS_BUCKET  — gs://bucket/optional/prefix to upload the binary under.

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolve which arch legs to build from the checkbox inputs. A deselected arch
  # is simply left out of the matrix here — the `matrix` context isn't available
  # in a job-level `if`, so legs can't be filtered there.
  matrix:
    name: Resolve arch matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - id: gen
        run: |
          legs=()
          if [ "${{ inputs.build_x86_64 }}" = "true" ]; then
            legs+=('{"arch":"x86_64","runner":"ubuntu-24.04"}')
          fi
          if [ "${{ inputs.build_aarch64 }}" = "true" ]; then
            legs+=('{"arch":"aarch64","runner":"ubuntu-24.04-arm"}')
          fi
          if [ ${#legs[@]} -eq 0 ]; then
            echo "::error::Select at least one architecture (build_x86_64 / build_aarch64)."
            exit 1
          fi
          include=$(IFS=,; echo "[${legs[*]}]")
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "Building: $include"

  # Resume the self-hosted GCP VM (ci-runner-x86) when opted in, so its gcp-builder
  # runners are online for the x86_64 build. Only the x86_64 leg can use it (the
  # box is X64); the aarch64 leg always builds on a hosted arm64 runner.
  start-ci:
    name: Start GCP runner
    # Only the x86_64 build can use the box, so only resume it when that build is
    # both selected and routed to the self-hosted runner.
    if: ${{ inputs.use_gcp_runner && inputs.build_x86_64 }}
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: pivot-ci
      - name: Resume ci-runner-x86
        run: |
          gcloud compute instances resume ci-runner-x86 \
            --project=pivot-ci --zone=me-west1-c

  deploy:
    needs: [matrix, start-ci]
    # start-ci is skipped unless opted in, so accept its skipped result too.
    if: ${{ always() && needs.matrix.result == 'success' && (needs.start-ci.result == 'success' || needs.start-ci.result == 'skipped') }}
    name: Build ${{ matrix.arch }} release + upload to GCS
    # x86_64 can run on the self-hosted gcp-builder when opted in; aarch64 always
    # uses a hosted arm64 runner (the box is X64-only). Native runners per arch —
    # no emulation.
    runs-on: ${{ inputs.use_gcp_runner && matrix.arch == 'x86_64' && 'gcp-builder' || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # C toolchain for the duckdb / arrow-rs native deps (mirrors the bench
      # Dockerfile's build stage).
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config git ca-certificates

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build release binary (${{ matrix.arch }})
        working-directory: server
        run: |
          # ci-runner-x86 is Ubuntu 20.04 with gcc 9.4, which aws-lc-sys rejects
          # (GCC bug 95189). Build the C/C++ deps with clang there; GitHub-hosted
          # runners have a newer, unaffected gcc, so leave them on the default.
          if [ "${{ inputs.use_gcp_runner && matrix.arch == 'x86_64' }}" = "true" ]; then
            export CC=clang CXX=clang++
          fi
          cargo build --release --bin pivotdb-server

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload binary to GCS
        env:
          BUCKET: ${{ inputs.bucket != '' && inputs.bucket || vars.DEPLOY_GCS_BUCKET }}
          SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ -z "$BUCKET" ]; then
            echo "::error::No destination bucket. Set the DEPLOY_GCS_BUCKET repo variable or pass the 'bucket' input."
            exit 1
          fi
          # Strip any trailing slash so we control the joins below.
          BUCKET="${BUCKET%/}"
          BIN=server/target/release/pivotdb-server

          # Upload an immutable, SHA-pinned copy plus a moving `latest` pointer.
          gcloud storage cp "$BIN" "$BUCKET/pivotdb-server-$ARCH-$SHA"
          gcloud storage cp "$BIN" "$BUCKET/pivotdb-server-$ARCH-latest"

          echo "Uploaded to:"
          echo "  $BUCKET/pivotdb-server-$ARCH-$SHA"
          echo "  $BUCKET/pivotdb-server-$ARCH-latest"

  # NOTE: no stop job here. ci-runner-x86's hourly suspend-if-unused cron suspends
  # the box only when no ci/deploy run is active, so it can't be killed out from
  # under a concurrent run — which an unconditional suspend job here would do.
