name: Deploy Binaries

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "Destination GCS bucket (overrides the DEPLOY_GCS_BUCKET repo variable). e.g. gs://my-bucket/path"
        required: false
        default: ""
      build_x86_64:
        description: "Build & deploy the x86_64 binary"
        type: boolean
        default: true
      build_aarch64:
        description: "Build & deploy the aarch64 binary"
        type: boolean
        default: true
      use_gcp_runner:
        description: "Build on the self-hosted GCP runners (run on github runners if off)."
        type: boolean
        default: true
      push_docker:
        description: "publish on dockerhub"
        type: boolean
        default: true
      publish_install:
        description: "Publish the CLI binaries"
        type: boolean
        default: true
      release_candidate:
        description: "Publish as release candidate"
        type: boolean
        default: true
      override:
        description: "Override previous version deployment"
        type: boolean
        default: false

# Required secrets:
#   GCP_SA_KEY  — JSON key for a service account with objectAdmin on the bucket.
#                 For use_gcp_runner it also needs to bring the runner VMs online:
#                 instance-scoped compute.instanceAdmin.v1 on ci-runner-x86 and
#                 ci-runner-aarch64, plus iam.serviceAccountUser on ci-runner-aarch64's
#                 attached service account (starting a stopped VM requires it).
# Required repository variables (unless overridden via the `bucket` input):
#   DEPLOY_GCS_BUCKET  — gs://bucket/optional/prefix to upload the binary under.
# For the Docker Hub push (push_docker), the org-level DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN secrets are used; that account must have push access to
# giladkl/pivot.
# publish_install puts the CLI binaries in a public bucket, reusing GCP_SA_KEY,
# which needs objectAdmin on it. The install script and the docs are published
# separately by the Deploy Web workflow; the script always resolves the newest
# version from the bucket, so a release reaches users without the site changing.
#   PIVOT_DOWNLOAD_BUCKET  (variable) public bucket for the downloads, e.g.
#                                     gs://pivot-releases. NOT the private
#                                     DEPLOY_GCS_BUCKET above.
#   PIVOT_DOWNLOAD_URL     (variable) how that bucket is reached over HTTPS,
#                                     e.g. https://storage.googleapis.com/pivot-releases

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolve which arch legs to build from the checkbox inputs. A deselected arch
  # is simply left out of the matrix here — the `matrix` context isn't available
  # in a job-level `if`, so legs can't be filtered there.
  matrix:
    name: Resolve arch matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - id: gen
        run: |
          legs=()
          if [ "${{ inputs.build_x86_64 }}" = "true" ]; then
            legs+=('{"arch":"x86_64","deb_arch":"amd64","runner":"ubuntu-24.04"}')
          fi
          if [ "${{ inputs.build_aarch64 }}" = "true" ]; then
            legs+=('{"arch":"aarch64","deb_arch":"arm64","runner":"ubuntu-24.04-arm"}')
          fi
          if [ ${#legs[@]} -eq 0 ]; then
            echo "::error::Select at least one architecture (build_x86_64 / build_aarch64)."
            exit 1
          fi
          include=$(IFS=,; echo "[${legs[*]}]")
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "Building: $include"

  # Bring the self-hosted GCP VMs online when opted in: ci-runner-x86 (x86_64
  # binary build + Docker image build) and ci-runner-aarch64 (aarch64 binary
  # build). Each box only wakes when something that runs on it is selected.
  start-ci:
    name: Start GCP runner
    # Resume the box when anything that runs on it is selected: the x86_64 binary
    # build or the Docker image build.
    if: ${{ inputs.use_gcp_runner && (inputs.build_x86_64 || inputs.push_docker) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/resume-gcp-runner
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

  start-ci-arm:
    name: Start GCP ARM runner
    if: ${{ inputs.use_gcp_runner && inputs.build_aarch64 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/resume-gcp-runner
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          instance: ci-runner-aarch64
          zone: europe-west3-b

  deploy:
    needs: [matrix, start-ci, start-ci-arm]
    # The start jobs are skipped unless opted in, so accept their skipped
    # results too.
    if: ${{ always() && needs.matrix.result == 'success' && (needs.start-ci.result == 'success' || needs.start-ci.result == 'skipped') && (needs.start-ci-arm.result == 'success' || needs.start-ci-arm.result == 'skipped') }}
    name: Build ${{ matrix.arch }} release + package + upload to GCS
    # Each arch builds on its native self-hosted box when opted in (gcp-builder
    # is X64, gcp-builder-arm is ARM64); otherwise on the hosted runner from the
    # matrix. Native runners per arch — no emulation.
    runs-on: ${{ inputs.use_gcp_runner && (matrix.arch == 'x86_64' && 'gcp-builder' || 'gcp-builder-arm') || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      # One build produces both shipped artifacts: `dist/pivot` is the binary
      # uploaded to GCS, and `dist/pivot_*.deb` wraps that exact binary, so the
      # package can never drift from the released server. It runs in the
      # packaging image's Debian Bullseye environment (glibc 2.31), which keeps
      # both artifacts usable on Debian 11+ and Ubuntu 20.04+ and sidesteps
      # ci-runner-x86's gcc 9.4, which aws-lc-sys rejects (GCC bug 95189).
      - name: Build release binary + Debian package (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/debian/Dockerfile
          target: package
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=debian-${{ matrix.deb_arch }}
          # ignore-error keeps a cache-service outage from failing a build
          # whose artifacts are already produced; the next run is just colder.
          cache-to: type=gha,scope=debian-${{ matrix.deb_arch }},mode=max,ignore-error=true

      - name: Inspect package
        run: packaging/debian/test-package.sh dist/pivot_*_${{ matrix.deb_arch }}.deb

      # The install test runs in a throwaway container, so it is safe on the
      # self-hosted boxes too.
      - name: Test package installation
        run: packaging/debian/test-install.sh dist/pivot_*_${{ matrix.deb_arch }}.deb

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload binary and package to GCS
        env:
          BUCKET: ${{ inputs.bucket != '' && inputs.bucket || vars.DEPLOY_GCS_BUCKET }}
          SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          if [ -z "$BUCKET" ]; then
            echo "::error::No destination bucket. Set the DEPLOY_GCS_BUCKET repo variable or pass the 'bucket' input."
            exit 1
          fi
          # Strip any trailing slash so we control the joins below.
          BUCKET="${BUCKET%/}"
          BIN=dist/pivot
          DEB=$(echo dist/pivot_*_"$DEB_ARCH".deb)
          [ -f "$DEB" ] || { echo "::error::No .deb for $DEB_ARCH under dist/."; exit 1; }

          # Upload an immutable, SHA-pinned copy plus a moving `latest` pointer.
          gcloud storage cp "$BIN" "$BUCKET/pivot-$ARCH-$SHA"
          gcloud storage cp "$BIN" "$BUCKET/pivot-$ARCH-latest"
          gcloud storage cp "$DEB" "$BUCKET/pivot-$ARCH-$SHA.deb"
          gcloud storage cp "$DEB" "$BUCKET/pivot-$ARCH-latest.deb"

          echo "Uploaded to:"
          echo "  $BUCKET/pivot-$ARCH-$SHA"
          echo "  $BUCKET/pivot-$ARCH-latest"
          echo "  $BUCKET/pivot-$ARCH-$SHA.deb"
          echo "  $BUCKET/pivot-$ARCH-latest.deb"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pivot-deb-${{ matrix.deb_arch }}
          path: dist/pivot_*_${{ matrix.deb_arch }}.deb
          if-no-files-found: error

      # Handed to publish-install below, which gzips it and uploads it to the
      # download host. The very binary uploaded to GCS above, so what a user
      # installs and what we keep for symbolizing a backtrace are one file.
      - name: Upload the download binary
        if: ${{ inputs.publish_install }}
        uses: actions/upload-artifact@v4
        with:
          name: pivot-binary-linux-${{ matrix.deb_arch }}
          path: dist/pivot
          if-no-files-found: error

  # Publish the CLI download to the release bucket. Only the bucket: the
  # install script and the docs are the Deploy Web workflow's job, and the
  # script always resolves the newest version from the bucket, so publishing a
  # release here reaches users without touching the site at all.
  publish-install:
    name: Publish the CLI download
    needs: [deploy]
    if: ${{ inputs.publish_install }}
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.PIVOT_DOWNLOAD_BUCKET }}
      DOWNLOAD_URL: ${{ vars.PIVOT_DOWNLOAD_URL }}
      PLATFORMS: linux-amd64 linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Checked before a single byte is uploaded, so a missing setting fails in
      # the first ten seconds rather than halfway through publishing a release.
      - name: Check the publish configuration
        run: |
          set -euo pipefail
          missing=
          [ -n "$BUCKET" ] || missing="$missing\n  PIVOT_DOWNLOAD_BUCKET (variable): public bucket for the downloads, e.g. gs://pivot-releases"
          [ -n "$DOWNLOAD_URL" ] || missing="$missing\n  PIVOT_DOWNLOAD_URL (variable): how that bucket is reached over HTTPS, e.g. https://storage.googleapis.com/pivot-releases"
          if [ -n "$missing" ]; then
            printf "::error::Publishing is not configured yet. Set:%b\n" "$missing"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: pivot-binary-*
          path: binaries

      # A release candidate carries the commit so it cannot be confused with the
      # real thing, and so successive candidates for one version coexist. The
      # release itself is exactly what Cargo.toml names.
      - name: Resolve the release version
        id: release
        run: |
          set -euo pipefail
          workspace_version=$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"$/\1/')
          case "$workspace_version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Could not read the workspace version from Cargo.toml (got '$workspace_version')."; exit 1 ;;
          esac
          if [ "${{ inputs.release_candidate }}" = "true" ]; then
            version=$workspace_version-rc$(git rev-parse --short=7 HEAD)
            echo "Publishing Pivot $version, a candidate for $workspace_version"
          else
            version=$workspace_version
            echo "Publishing Pivot $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A published version is immutable: people have it installed, and its
      # objects are served with a year-long cache lifetime, so rewriting one is
      # not reliably visible to anyone who already fetched it.
      - name: Refuse to republish an existing version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if gcloud storage ls "$BUCKET/v$VERSION/" >/dev/null 2>&1; then
            if [ "${{ inputs.override }}" = "true" ]; then
              echo "::warning::$VERSION is already published; override is on, so it will be rewritten."
            else
              echo "::error::$VERSION is already published at $BUCKET/v$VERSION. Bump the version in Cargo.toml, or re-run with override to rewrite it."
              exit 1
            fi
          fi

      # A release is published whole or not at all: an install script that finds
      # latest_version.txt pointing at a set missing the caller's platform is
      # broken for that caller, and nothing in the bucket would say so.
      - name: Assemble the release tree
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          release_directory=release/v$VERSION
          mkdir -p "$release_directory"
          for platform in $PLATFORMS; do
            binary=binaries/pivot-binary-$platform/pivot
            [ -f "$binary" ] || {
              echo "::error::No binary was built for $platform, so this release would be incomplete. Re-run with every architecture selected."
              exit 1
            }
            gzip -9 --stdout "$binary" > "$release_directory/pivot-$platform.gz"
          done
          # Checksums are written from inside the release directory so each file
          # names its sibling rather than a path off the build runner.
          (cd "$release_directory" && for platform in $PLATFORMS; do
            sha256sum "pivot-$platform.gz" > "pivot-$platform.gz.sha256"
          done)
          ls -l "$release_directory"

      - name: Publish the release to the bucket
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # A version directory never changes, so it can be cached forever. The
          # objects are handed out as-is: a bucket that served them with
          # Content-Encoding: gzip would decompress them in transit and the
          # installer's checksum would not match.
          gcloud storage cp --recursive \
            --cache-control="public, max-age=31536000, immutable" \
            "release/v$VERSION" "$BUCKET/"

          # A candidate stops here. Its objects exist and are installable by
          # name, but nothing points at them, so `curl | sh` still resolves the
          # last real release.
          if [ "${{ inputs.release_candidate }}" = "true" ]; then
            echo "Published candidate $VERSION. Install it with:"
            echo "    curl https://pivotlake.io | PIVOT_VERSION=$VERSION sh"
            exit 0
          fi

          # latest_version.txt goes last, on its own: until it moves, the new
          # release sits complete but unadvertised, and every installer still
          # resolves the previous one. It must never be cached, or the release
          # stays invisible for as long as the cache holds.
          printf '%s\n' "$VERSION" > latest_version.txt
          gcloud storage cp --cache-control="no-cache" \
            latest_version.txt "$BUCKET/latest_version.txt"

      # What the bucket actually serves, checked the way the installer reaches
      # it: the bytes back off the network, then the script from this commit
      # driven end to end against them.
      - name: Verify what the bucket serves
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for platform in $PLATFORMS; do
            curl --fail --silent --show-error --location \
              --output "served-pivot-$platform.gz" "$DOWNLOAD_URL/v$VERSION/pivot-$platform.gz"
            served=$(sha256sum "served-pivot-$platform.gz" | cut -d' ' -f1)
            published=$(cut -d' ' -f1 < "release/v$VERSION/pivot-$platform.gz.sha256")
            [ "$served" = "$published" ] ||
              { echo "::error::$DOWNLOAD_URL/v$VERSION/pivot-$platform.gz does not match what was published. Is the bucket serving it with Content-Encoding: gzip?"; exit 1; }
          done

          # A candidate is reachable only by name, so drive the installer at it
          # the way a tester would. `latest` must still be whatever it was.
          if [ "${{ inputs.release_candidate }}" = "true" ]; then
            PIVOT_BASE_URL=$DOWNLOAD_URL PIVOT_VERSION=$VERSION sh packaging/install/install.sh
            "$HOME/.pivot/cli/$VERSION/pivot" --version

            advertised=$(curl --fail --silent --show-error --location "$DOWNLOAD_URL/latest_version.txt" | tr -d '[:space:]')
            [ "$advertised" != "$VERSION" ] ||
              { echo "::error::$DOWNLOAD_URL/latest_version.txt advertises the candidate $VERSION. A candidate must not become latest."; exit 1; }
            echo "latest_version.txt still advertises $advertised, as it should."
            exit 0
          fi

          served_version=$(curl --fail --silent --show-error --location "$DOWNLOAD_URL/latest_version.txt" | tr -d '[:space:]')
          [ "$served_version" = "$VERSION" ] ||
            { echo "::error::$DOWNLOAD_URL/latest_version.txt serves '$served_version', expected '$VERSION'."; exit 1; }

          PIVOT_BASE_URL=$DOWNLOAD_URL sh packaging/install/install.sh
          "$HOME/.pivot/cli/latest/pivot" --version

  # Build the pivot server image and push it to Docker Hub (giladkl/pivot),
  # tagged with both the commit SHA and `latest`. Independent of the binary
  # matrix above, but shares the self-hosted gcp-builder when opted in, so it
  # waits on start-ci to resume the box.
  docker:
    name: Build & push Docker image
    needs: [start-ci]
    # start-ci is skipped unless opted in, so accept its skipped result too.
    if: ${{ always() && inputs.push_docker && (needs.start-ci.result == 'success' || needs.start-ci.result == 'skipped') }}
    # Build on the self-hosted gcp-builder when opted in (like the binary legs);
    # otherwise fall back to a hosted runner.
    runs-on: ${{ inputs.use_gcp_runner && 'gcp-builder' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            giladkl/pivot:${{ github.sha }}
            giladkl/pivot:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

  # NOTE: no stop job here. Each self-hosted box runs an hourly if-unused cron
  # (suspend on ci-runner-x86, stop on ci-runner-aarch64) that only takes it down when
  # no ci/deploy run is active, so it can't be killed out from under a
  # concurrent run — which an unconditional stop job here would do.
