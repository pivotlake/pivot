name: Deploy Binaries

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "Destination GCS bucket (overrides the DEPLOY_GCS_BUCKET repo variable). e.g. gs://my-bucket/path"
        required: false
        default: ""
      build_x86_64:
        description: "Build & deploy the x86_64 binary"
        type: boolean
        default: true
      build_aarch64:
        description: "Build & deploy the aarch64 binary"
        type: boolean
        default: true
      use_gcp_runner:
        description: "Build on the self-hosted GCP runners (run on github runners if off)."
        type: boolean
        default: true
      push_docker:
        description: "publish on dockerhub"
        type: boolean
        default: true
      publish_install:
        description: "Publish the CLI binaries"
        type: boolean
        default: true
      publish_apt:
        description: "Publish the Debian package repository"
        type: boolean
        default: true
      release_candidate:
        description: "Publish as release candidate"
        type: boolean
        default: true
      override:
        description: "Delete and republish an existing version (installed APT clients will not upgrade)"
        type: boolean
        default: false

# Required secrets:
#   GCP_SA_KEY  — JSON key for a service account with objectAdmin on the bucket.
#                 For use_gcp_runner it also needs to bring the runner VMs online:
#                 instance-scoped compute.instanceAdmin.v1 on ci-runner2 and
#                 ci-runner-arm, plus iam.serviceAccountUser on ci-runner-arm's
#                 attached service account (starting a stopped VM requires it).
# Required repository variables (unless overridden via the `bucket` input):
#   DEPLOY_GCS_BUCKET  — gs://bucket/optional/prefix to upload the binary under.
#   PIVOT_PGO_TRAINING_GCS — gs://bucket/prefix holding the PGO training data
#                            (clickbench-hits-subset/ and tpch-sf1/, see
#                            packaging/pgo/train.sh). GCP_SA_KEY needs read
#                            access on it.
# For the Docker Hub push (push_docker), the org-level DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN secrets are used; that account must have push access to
# pivotlake/pivot.
# publish_install puts the CLI binaries in a public bucket, reusing GCP_SA_KEY,
# which needs objectAdmin on it. The install script and the docs are published
# separately by the Deploy Web workflow; the script always resolves the newest
# version from the bucket, so a release reaches users without the site changing.
#   PIVOT_DOWNLOAD_BUCKET  (variable) public bucket for the downloads, e.g.
#                                     gs://pivot-releases. NOT the private
#                                     DEPLOY_GCS_BUCKET above.
#   PIVOT_DOWNLOAD_URL     (variable) how that bucket is reached over HTTPS,
#                                     e.g. https://storage.googleapis.com/pivot-releases
# publish_apt additionally uses:
#   PIVOT_APT_PROJECT       (variable) Artifact Registry project, e.g. epsio-io
#   PIVOT_APT_LOCATION      (variable) Artifact Registry location, e.g. us
#   PIVOT_APT_URL           (variable) public proxy URL, e.g.
#                                     https://packages.pivotlake.io/deb

env:
  CARGO_TERM_COLOR: always

# Serializing releases prevents stable/testing updates from interleaving and
# makes candidate package timestamps strictly increase between runs.
concurrency:
  group: pivot-release
  cancel-in-progress: false

jobs:
  # Resolve which arch legs to build from the checkbox inputs. A deselected arch
  # is simply left out of the matrix here — the `matrix` context isn't available
  # in a job-level `if`, so legs can't be filtered there.
  matrix:
    name: Resolve arch matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - id: gen
        run: |
          if [ "${{ inputs.push_docker }}" = "true" ] && { [ "${{ inputs.build_x86_64 }}" != "true" ] || [ "${{ inputs.build_aarch64 }}" != "true" ]; }; then
            echo "::error::The Docker image wraps the released binaries for both architectures. Enable build_x86_64 and build_aarch64, or disable push_docker."
            exit 1
          fi
          if [ "${{ inputs.publish_apt }}" = "true" ] && { [ "${{ inputs.build_x86_64 }}" != "true" ] || [ "${{ inputs.build_aarch64 }}" != "true" ]; }; then
            echo "::error::The APT repository publishes amd64 and arm64 atomically. Enable both architectures, or disable publish_apt."
            exit 1
          fi
          legs=()
          if [ "${{ inputs.build_x86_64 }}" = "true" ]; then
            legs+=('{"arch":"x86_64","deb_arch":"amd64","runner":"ubuntu-24.04"}')
          fi
          if [ "${{ inputs.build_aarch64 }}" = "true" ]; then
            legs+=('{"arch":"aarch64","deb_arch":"arm64","runner":"ubuntu-24.04-arm"}')
          fi
          if [ ${#legs[@]} -eq 0 ]; then
            echo "::error::Select at least one architecture (build_x86_64 / build_aarch64)."
            exit 1
          fi
          include=$(IFS=,; echo "[${legs[*]}]")
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "Building: $include"

  # Resolve every public version once so the parallel architecture legs, raw
  # downloads, Docker tags, git tag, and APT repository cannot disagree. APT
  # gets Debian ordering syntax; the existing public artifact names stay
  # backward compatible.
  version:
    name: Resolve release versions
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      deb: ${{ steps.version.outputs.deb }}
      apt_distribution: ${{ steps.version.outputs.apt_distribution }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          set -euo pipefail
          workspace_version=$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"$/\1/')
          case "$workspace_version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Could not read the workspace version from Cargo.toml (got '$workspace_version')."; exit 1 ;;
          esac
          short_sha=$(git rev-parse --short=7 HEAD)
          if [ "${{ inputs.release_candidate }}" = "true" ]; then
            timestamp=$(date -u +'%Y%m%d.%H%M%S')
            release=$workspace_version-rc$short_sha
            deb=$workspace_version~rc.$timestamp+git.$short_sha
            apt_distribution=testing
          else
            release=$workspace_version
            deb=$workspace_version
            apt_distribution=stable
          fi
          dpkg --validate-version "$deb"
          printf 'Release version: %s\nDebian version: %s\nAPT distribution: %s\n' \
            "$release" "$deb" "$apt_distribution"
          {
            echo "release=$release"
            echo "deb=$deb"
            echo "apt_distribution=$apt_distribution"
          } >> "$GITHUB_OUTPUT"

  # Bring the self-hosted GCP VMs online when opted in: ci-runner2 (x86_64
  # binary build) and ci-runner-arm (aarch64 binary build). Each box only
  # wakes when something that runs on it is selected. The Docker image job
  # runs on a hosted runner, so it never needs a box.
  start-ci:
    name: Start GCP runner
    if: ${{ inputs.use_gcp_runner && inputs.build_x86_64 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/resume-gcp-runner
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

  start-ci-arm:
    name: Start GCP ARM runner
    if: ${{ inputs.use_gcp_runner && inputs.build_aarch64 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/resume-gcp-runner
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          instance: ci-runner-arm
          zone: europe-west3-b

  deploy:
    needs: [matrix, version, start-ci, start-ci-arm]
    # The start jobs are skipped unless opted in, so accept their skipped
    # results too.
    if: ${{ always() && needs.matrix.result == 'success' && needs.version.result == 'success' && (needs.start-ci.result == 'success' || needs.start-ci.result == 'skipped') && (needs.start-ci-arm.result == 'success' || needs.start-ci-arm.result == 'skipped') }}
    name: Build ${{ matrix.arch }} release + package + upload to GCS
    # Each arch builds on its native self-hosted box when opted in (gcp-builder
    # is X64, gcp-builder-arm is ARM64); otherwise on the hosted runner from the
    # matrix. Native runners per arch — no emulation.
    runs-on: ${{ inputs.use_gcp_runner && (matrix.arch == 'x86_64' && 'gcp-builder' || 'gcp-builder-arm') || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      # Auth happens before the build now: the PGO training data is pulled
      # from GCS, and the upload at the end reuses the same credentials.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Download the PGO training data
        env:
          TRAINING_BUCKET: ${{ vars.PIVOT_PGO_TRAINING_GCS }}
        run: |
          set -euo pipefail
          if [ -z "$TRAINING_BUCKET" ]; then
            echo "::error::No PGO training data location. Set the PIVOT_PGO_TRAINING_GCS repo variable (e.g. gs://bucket/pgo-training)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pgo-training"
          gcloud storage rsync -r "${TRAINING_BUCKET%/}" "$RUNNER_TEMP/pgo-training"

      # First PGO pass: an instrumented server plus the pivot-bench client
      # that drives it. Its own cache scope, so the instrumented layers and
      # the release layers below stay warm independently.
      - name: Build instrumented binaries (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/debian/Dockerfile
          target: instrumented
          outputs: type=local,dest=dist-pgo
          cache-from: type=gha,scope=debian-${{ matrix.deb_arch }}-pgogen
          cache-to: type=gha,scope=debian-${{ matrix.deb_arch }}-pgogen,mode=max,ignore-error=true

      # The training run executes on the runner host: the binaries link
      # against Bullseye's glibc 2.31, which any newer host glibc runs.
      # pivot-bench boots the server itself over a scratch datastore.
      - name: Run the PGO training workload
        run: |
          set -euo pipefail
          chmod +x dist-pgo/pivot dist-pgo/pivot-bench
          packaging/pgo/train.sh \
            --server-bin dist-pgo/pivot --bench-bin dist-pgo/pivot-bench \
            --data-dir "$RUNNER_TEMP/pgo-training" --out-dir pgo-profiles

      # One build produces both shipped artifacts: `dist/pivot` is the binary
      # uploaded to GCS, and `dist/pivot_*.deb` wraps that exact binary, so the
      # package can never drift from the released server. It runs in the
      # packaging image's Debian Bullseye environment (glibc 2.31), which keeps
      # both artifacts usable on Debian 11+ and Ubuntu 20.04+ and sidesteps
      # ci-runner2's gcc 9.4, which aws-lc-sys rejects (GCC bug 95189).
      # The profile-use build reads pgo-profiles/ from the context and fails
      # without it, so a release can never silently ship un-PGOed.
      - name: Build release binary + Debian package (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/debian/Dockerfile
          target: package
          outputs: type=local,dest=dist
          build-args: |
            PIVOT_DEB_VERSION=${{ needs.version.outputs.deb }}
          cache-from: type=gha,scope=debian-${{ matrix.deb_arch }}
          # ignore-error keeps a cache-service outage from failing a build
          # whose artifacts are already produced; the next run is just colder.
          cache-to: type=gha,scope=debian-${{ matrix.deb_arch }},mode=max,ignore-error=true

      - name: Inspect package
        run: packaging/debian/test-package.sh dist/pivot_*_${{ matrix.deb_arch }}.deb

      # The install test runs in a throwaway container, so it is safe on the
      # self-hosted boxes too.
      - name: Test package installation
        run: packaging/debian/test-install.sh dist/pivot_*_${{ matrix.deb_arch }}.deb

      - name: Upload binary and package to GCS
        env:
          BUCKET: ${{ inputs.bucket != '' && inputs.bucket || vars.DEPLOY_GCS_BUCKET }}
          SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          if [ -z "$BUCKET" ]; then
            echo "::error::No destination bucket. Set the DEPLOY_GCS_BUCKET repo variable or pass the 'bucket' input."
            exit 1
          fi
          # Strip any trailing slash so we control the joins below.
          BUCKET="${BUCKET%/}"
          BIN=dist/pivot
          DEB=$(echo dist/pivot_*_"$DEB_ARCH".deb)
          [ -f "$DEB" ] || { echo "::error::No .deb for $DEB_ARCH under dist/."; exit 1; }

          # Upload an immutable, SHA-pinned copy plus a moving `latest` pointer.
          gcloud storage cp "$BIN" "$BUCKET/pivot-$ARCH-$SHA"
          gcloud storage cp "$BIN" "$BUCKET/pivot-$ARCH-latest"
          gcloud storage cp "$DEB" "$BUCKET/pivot-$ARCH-$SHA.deb"
          gcloud storage cp "$DEB" "$BUCKET/pivot-$ARCH-latest.deb"

          echo "Uploaded to:"
          echo "  $BUCKET/pivot-$ARCH-$SHA"
          echo "  $BUCKET/pivot-$ARCH-latest"
          echo "  $BUCKET/pivot-$ARCH-$SHA.deb"
          echo "  $BUCKET/pivot-$ARCH-latest.deb"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pivot-deb-${{ matrix.deb_arch }}
          path: dist/pivot_*_${{ matrix.deb_arch }}.deb
          if-no-files-found: error

      # Handed to publish-install below (which gzips it for the download host)
      # and to the docker job (which wraps it in the server image). The very
      # binary uploaded to GCS above, so what a user installs, what the image
      # runs, and what we keep for symbolizing a backtrace are one file.
      - name: Upload the release binary
        uses: actions/upload-artifact@v4
        with:
          name: pivot-binary-linux-${{ matrix.deb_arch }}
          path: dist/pivot
          if-no-files-found: error

  # Publish the CLI download to the release bucket. Only the bucket: the
  # install script and the docs are the Deploy Web workflow's job, and the
  # script always resolves the newest version from the bucket, so publishing a
  # release here reaches users without touching the site at all.
  publish-install:
    name: Publish the CLI download
    needs: [deploy, version]
    if: ${{ inputs.publish_install }}
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.PIVOT_DOWNLOAD_BUCKET }}
      DOWNLOAD_URL: ${{ vars.PIVOT_DOWNLOAD_URL }}
      PLATFORMS: linux-amd64 linux-arm64
      VERSION: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Checked before a single byte is uploaded, so a missing setting fails in
      # the first ten seconds rather than halfway through publishing a release.
      - name: Check the publish configuration
        run: |
          set -euo pipefail
          missing=
          [ -n "$BUCKET" ] || missing="$missing\n  PIVOT_DOWNLOAD_BUCKET (variable): public bucket for the downloads, e.g. gs://pivot-releases"
          [ -n "$DOWNLOAD_URL" ] || missing="$missing\n  PIVOT_DOWNLOAD_URL (variable): how that bucket is reached over HTTPS, e.g. https://storage.googleapis.com/pivot-releases"
          if [ -n "$missing" ]; then
            printf "::error::Publishing is not configured yet. Set:%b\n" "$missing"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: pivot-binary-*
          path: binaries

      # A published version is immutable: people have it installed, and its
      # objects are served with a year-long cache lifetime, so rewriting one is
      # not reliably visible to anyone who already fetched it.
      - name: Refuse to republish an existing version
        run: |
          set -euo pipefail
          if gcloud storage ls "$BUCKET/v$VERSION/" >/dev/null 2>&1; then
            if [ "${{ inputs.override }}" = "true" ]; then
              echo "::warning::$VERSION is already published; override is on, so it will be rewritten."
            else
              echo "::error::$VERSION is already published at $BUCKET/v$VERSION. Bump the version in Cargo.toml, or re-run with override to rewrite it."
              exit 1
            fi
          fi

      # A release is published whole or not at all: an install script that finds
      # latest_version.txt pointing at a set missing the caller's platform is
      # broken for that caller, and nothing in the bucket would say so.
      - name: Assemble the release tree
        run: |
          set -euo pipefail
          release_directory=release/v$VERSION
          mkdir -p "$release_directory"
          for platform in $PLATFORMS; do
            binary=binaries/pivot-binary-$platform/pivot
            [ -f "$binary" ] || {
              echo "::error::No binary was built for $platform, so this release would be incomplete. Re-run with every architecture selected."
              exit 1
            }
            gzip -9 --stdout "$binary" > "$release_directory/pivot-$platform.gz"
          done
          # Checksums are written from inside the release directory so each file
          # names its sibling rather than a path off the build runner.
          (cd "$release_directory" && for platform in $PLATFORMS; do
            sha256sum "pivot-$platform.gz" > "pivot-$platform.gz.sha256"
          done)
          ls -l "$release_directory"

      - name: Publish the release to the bucket
        run: |
          set -euo pipefail
          # A version directory never changes, so it can be cached forever. The
          # objects are handed out as-is: a bucket that served them with
          # Content-Encoding: gzip would decompress them in transit and the
          # installer's checksum would not match.
          gcloud storage cp --recursive \
            --cache-control="public, max-age=31536000, immutable" \
            "release/v$VERSION" "$BUCKET/"

          # A candidate stops here. Its objects exist and are installable by
          # name, but nothing points at them, so `curl | sh` still resolves the
          # last real release.
          if [ "${{ inputs.release_candidate }}" = "true" ]; then
            echo "Published candidate $VERSION. Install it with:"
            echo "    curl https://pivotlake.io | PIVOT_VERSION=$VERSION sh"
            exit 0
          fi

          # latest_version.txt goes last, on its own: until it moves, the new
          # release sits complete but unadvertised, and every installer still
          # resolves the previous one. It must never be cached, or the release
          # stays invisible for as long as the cache holds.
          printf '%s\n' "$VERSION" > latest_version.txt
          gcloud storage cp --cache-control="no-cache" \
            latest_version.txt "$BUCKET/latest_version.txt"

      # What the bucket actually serves, checked the way the installer reaches
      # it: the bytes back off the network, then the script from this commit
      # driven end to end against them.
      - name: Verify what the bucket serves
        run: |
          set -euo pipefail
          for platform in $PLATFORMS; do
            curl --fail --silent --show-error --location \
              --output "served-pivot-$platform.gz" "$DOWNLOAD_URL/v$VERSION/pivot-$platform.gz"
            served=$(sha256sum "served-pivot-$platform.gz" | cut -d' ' -f1)
            published=$(cut -d' ' -f1 < "release/v$VERSION/pivot-$platform.gz.sha256")
            [ "$served" = "$published" ] ||
              { echo "::error::$DOWNLOAD_URL/v$VERSION/pivot-$platform.gz does not match what was published. Is the bucket serving it with Content-Encoding: gzip?"; exit 1; }
          done

          # A candidate is reachable only by name, so drive the installer at it
          # the way a tester would. `latest` must still be whatever it was.
          if [ "${{ inputs.release_candidate }}" = "true" ]; then
            PIVOT_BASE_URL=$DOWNLOAD_URL PIVOT_VERSION=$VERSION sh packaging/install/install.sh
            "$HOME/.pivot/cli/$VERSION/pivot" --version

            advertised=$(curl --fail --silent --show-error --location "$DOWNLOAD_URL/latest_version.txt" | tr -d '[:space:]')
            [ "$advertised" != "$VERSION" ] ||
              { echo "::error::$DOWNLOAD_URL/latest_version.txt advertises the candidate $VERSION. A candidate must not become latest."; exit 1; }
            echo "latest_version.txt still advertises $advertised, as it should."
            exit 0
          fi

          served_version=$(curl --fail --silent --show-error --location "$DOWNLOAD_URL/latest_version.txt" | tr -d '[:space:]')
          [ "$served_version" = "$VERSION" ] ||
            { echo "::error::$DOWNLOAD_URL/latest_version.txt serves '$served_version', expected '$VERSION'."; exit 1; }

          PIVOT_BASE_URL=$DOWNLOAD_URL sh packaging/install/install.sh
          "$HOME/.pivot/cli/latest/pivot" --version

  # Upload the two already-tested package artifacts. Artifact Registry retains
  # versioned packages and generates and signs the APT indexes.
  publish-apt:
    name: Publish the APT repository (${{ needs.version.outputs.apt_distribution }})
    needs: [deploy, version]
    if: ${{ inputs.publish_apt }}
    runs-on: ubuntu-latest
    env:
      APT_PROJECT: ${{ vars.PIVOT_APT_PROJECT }}
      APT_LOCATION: ${{ vars.PIVOT_APT_LOCATION }}
      APT_URL: ${{ vars.PIVOT_APT_URL }}
      DEB_VERSION: ${{ needs.version.outputs.deb }}
      DISTRIBUTION: ${{ needs.version.outputs.apt_distribution }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the repository configuration
        run: |
          set -euo pipefail
          missing=
          [ -n "$APT_PROJECT" ] || missing="$missing\n  PIVOT_APT_PROJECT (variable): e.g. epsio-io"
          [ -n "$APT_LOCATION" ] || missing="$missing\n  PIVOT_APT_LOCATION (variable): e.g. us"
          [ -n "$APT_URL" ] || missing="$missing\n  PIVOT_APT_URL (variable): e.g. https://packages.pivotlake.io/deb"
          if [ -n "$missing" ]; then
            printf "::error::APT publishing is not configured. Set:%b\n" "$missing"
            exit 1
          fi
          case "$APT_PROJECT:$APT_LOCATION:$APT_URL" in
            *:*:https://*) ;;
            *) echo "::error::PIVOT_APT_PROJECT/location are required and PIVOT_APT_URL must be HTTPS."; exit 1 ;;
          esac

      - uses: actions/download-artifact@v4
        with:
          pattern: pivot-deb-*
          path: packages
          merge-multiple: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Publish packages to Artifact Registry
        run: |
          set -euo pipefail
          arguments=("$APT_PROJECT" "$APT_LOCATION" "$DISTRIBUTION")
          if [ "${{ inputs.override }}" = true ]; then
            arguments+=(--override)
          fi
          packaging/debian/repository/publish.sh "${arguments[@]}" packages/*.deb

      - name: Test apt update and install from the public URL
        run: |
          packaging/debian/repository/test-repository.sh \
            "$APT_URL" "$DISTRIBUTION" "$DEB_VERSION"
          if [ "$DISTRIBUTION" = stable ]; then
            packaging/debian/repository/test-repository.sh \
              "$APT_URL" testing "$DEB_VERSION"
          fi

  # Wrap the released binaries in the pivot server image and push it to Docker
  # Hub (pivotlake/pivot) as a multi-arch (amd64 + arm64) image. Candidates get
  # their versioned rc tag only. Real releases get their workspace version and
  # move `latest`. Nothing is compiled here: the image copies the exact
  # binaries the deploy matrix built, so the pushed image can never drift from
  # the released server, and the build takes seconds on a hosted runner.
  docker:
    name: Build & push Docker image
    needs: [deploy, version]
    if: ${{ always() && inputs.push_docker && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU runs the image's arm64 leg (an apt-get install plus a COPY) on
      # this amd64 runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Docker tags
        id: docker_tags
        env:
          VERSION: ${{ needs.version.outputs.release }}
        run: |
          {
            echo "tags<<EOF"
            echo "pivotlake/pivot:$VERSION"
            if [ "${{ inputs.release_candidate }}" != "true" ]; then
              echo "pivotlake/pivot:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download the released amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: pivot-binary-linux-amd64
          path: server/image/amd64

      - name: Download the released arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: pivot-binary-linux-arm64
          path: server/image/arm64

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: server/image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

  # Every published version gets a git tag pointing at the commit it was
  # built from, named exactly like the artifacts elsewhere in this workflow:
  # v0.3.0 for a real release, v0.3.0-rc<sha> for a candidate.
  tag-release:
    name: Tag the release
    needs: [deploy, version, publish-install, publish-apt, docker]
    # Publishers are skipped when deselected; tag once at least one published a
    # version and every selected publisher succeeded.
    if: ${{ always() && needs.deploy.result == 'success' && needs.version.result == 'success' && (needs.publish-install.result == 'success' || needs.publish-install.result == 'skipped') && (needs.publish-apt.result == 'success' || needs.publish-apt.result == 'skipped') && (needs.docker.result == 'success' || needs.docker.result == 'skipped') && (needs.publish-install.result == 'success' || needs.publish-apt.result == 'success' || needs.docker.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create and push the release tag
        env:
          VERSION: ${{ needs.version.outputs.release }}
        run: |
          set -euo pipefail
          tag=v$VERSION

          # A tag, like a published version, is immutable: it may only move
          # when the run explicitly overrides a previous deployment.
          existing=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          if [ -n "$existing" ]; then
            if [ "$existing" = "${{ github.sha }}" ]; then
              echo "$tag already points at ${{ github.sha }}; nothing to do."
              exit 0
            fi
            if [ "${{ inputs.override }}" != "true" ]; then
              echo "::error::$tag already exists at $existing. Bump the version in Cargo.toml, or re-run with override to move it."
              exit 1
            fi
            echo "::warning::$tag already exists at $existing; override is on, so it moves to ${{ github.sha }}."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate --message "Pivot $VERSION" "$tag" "${{ github.sha }}"
          git push --force origin "$tag"

  # NOTE: no stop job here. Each self-hosted box runs an hourly if-unused cron
  # (suspend on ci-runner2, stop on ci-runner-arm) that only takes it down when
  # no ci/deploy run is active, so it can't be killed out from under a
  # concurrent run — which an unconditional stop job here would do.
