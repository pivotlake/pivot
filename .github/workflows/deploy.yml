name: Deploy Server

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "Destination GCS bucket (overrides the DEPLOY_GCS_BUCKET repo variable). e.g. gs://my-bucket/path"
        required: false
        default: ""
      build_x86_64:
        description: "Build & deploy the x86_64 binary"
        type: boolean
        default: true
      build_aarch64:
        description: "Build & deploy the aarch64 binary"
        type: boolean
        default: true
      use_gcp_runner:
        description: "Build on the self-hosted GCP runners (ci-runner-x86 for x86_64, ci-runner-aarch64 for aarch64). On by default; uncheck to use GitHub-hosted runners."
        type: boolean
        default: true
      push_docker:
        description: "Build multi-arch (amd64+arm64) pivot and operator images and push to Docker Hub (giladkl/pivot, giladkl/pivot-operator)."
        type: boolean
        default: true

# Required secrets:
#   GCP_SA_KEY  — JSON key for a service account with objectAdmin on the bucket.
#                 For use_gcp_runner it also needs to bring the runner VMs online:
#                 instance-scoped compute.instanceAdmin.v1 on ci-runner-x86 and
#                 ci-runner-aarch64, plus iam.serviceAccountUser on ci-runner-aarch64's
#                 attached service account (starting a stopped VM requires it).
# Required repository variables (unless overridden via the `bucket` input):
#   DEPLOY_GCS_BUCKET  — gs://bucket/optional/prefix to upload the binary under.
# For the Docker Hub push (push_docker), the org-level DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN secrets are used; that account must have push access to
# giladkl/pivot and giladkl/pivot-operator.

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolve which arch legs to build from the checkbox inputs. A deselected arch
  # is simply left out of the matrix here — the `matrix` context isn't available
  # in a job-level `if`, so legs can't be filtered there.
  matrix:
    name: Resolve arch matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - id: gen
        run: |
          legs=()
          if [ "${{ inputs.build_x86_64 }}" = "true" ]; then
            legs+=('{"arch":"x86_64","runner":"ubuntu-24.04"}')
          fi
          if [ "${{ inputs.build_aarch64 }}" = "true" ]; then
            legs+=('{"arch":"aarch64","runner":"ubuntu-24.04-arm"}')
          fi
          # A run with no binary arch is valid when it only pushes images; the
          # binary `deploy` job then gets an empty matrix and is skipped.
          if [ ${#legs[@]} -eq 0 ] && [ "${{ inputs.push_docker }}" != "true" ]; then
            echo "::error::Select at least one architecture (build_x86_64 / build_aarch64) or enable push_docker."
            exit 1
          fi
          include=$(IFS=,; echo "[${legs[*]}]")
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "Building: $include"

  # Bring the self-hosted GCP VMs online when opted in: ci-runner-x86 (x86_64
  # binary + amd64 Docker builds) and ci-runner-aarch64 (aarch64 binary + arm64
  # Docker builds). Each box only wakes when something that runs on it is
  # selected.
  start-ci:
    name: Start GCP runner
    # Resume the box when anything that runs on it is selected: the x86_64 binary
    # build or the amd64 Docker image builds.
    if: ${{ inputs.use_gcp_runner && (inputs.build_x86_64 || inputs.push_docker) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/resume-gcp-runner
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

  start-ci-arm:
    name: Start GCP ARM runner
    # Resume the ARM box for the aarch64 binary build or the arm64 Docker builds.
    if: ${{ inputs.use_gcp_runner && (inputs.build_aarch64 || inputs.push_docker) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/resume-gcp-runner
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          instance: ci-runner-aarch64
          zone: europe-west3-b

  deploy:
    needs: [matrix, start-ci, start-ci-arm]
    # Skip entirely on a docker-only run (no binary arch), so the empty binary
    # matrix is never evaluated (an empty matrix would fail the run). The start
    # jobs are skipped unless opted in, so accept their skipped results too.
    if: ${{ always() && (inputs.build_x86_64 || inputs.build_aarch64) && needs.matrix.result == 'success' && (needs.start-ci.result == 'success' || needs.start-ci.result == 'skipped') && (needs.start-ci-arm.result == 'success' || needs.start-ci-arm.result == 'skipped') }}
    name: Build ${{ matrix.arch }} release + upload to GCS
    # Each arch builds on its native self-hosted box when opted in (gcp-builder
    # is X64, gcp-builder-arm is ARM64); otherwise on the hosted runner from the
    # matrix. Native runners per arch — no emulation.
    runs-on: ${{ inputs.use_gcp_runner && (matrix.arch == 'x86_64' && 'gcp-builder' || 'gcp-builder-arm') || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # C toolchain for the duckdb / arrow-rs native deps (mirrors the bench
      # Dockerfile's build stage).
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config git ca-certificates

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build release binary (${{ matrix.arch }})
        working-directory: server
        run: |
          # ci-runner-x86 is Ubuntu 20.04 with gcc 9.4, which aws-lc-sys rejects
          # (GCC bug 95189). Build the C/C++ deps with clang there; GitHub-hosted
          # runners have a newer, unaffected gcc, so leave them on the default.
          if [ "${{ inputs.use_gcp_runner && matrix.arch == 'x86_64' }}" = "true" ]; then
            export CC=clang CXX=clang++
          fi
          cargo build --release --bin pivotdb-server

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload binary to GCS
        env:
          BUCKET: ${{ inputs.bucket != '' && inputs.bucket || vars.DEPLOY_GCS_BUCKET }}
          SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ -z "$BUCKET" ]; then
            echo "::error::No destination bucket. Set the DEPLOY_GCS_BUCKET repo variable or pass the 'bucket' input."
            exit 1
          fi
          # Strip any trailing slash so we control the joins below.
          BUCKET="${BUCKET%/}"
          BIN=server/target/release/pivotdb-server

          # Upload an immutable, SHA-pinned copy plus a moving `latest` pointer.
          gcloud storage cp "$BIN" "$BUCKET/pivotdb-server-$ARCH-$SHA"
          gcloud storage cp "$BIN" "$BUCKET/pivotdb-server-$ARCH-latest"

          echo "Uploaded to:"
          echo "  $BUCKET/pivotdb-server-$ARCH-$SHA"
          echo "  $BUCKET/pivotdb-server-$ARCH-latest"

  # Build the pivot server image for each arch on a native runner (no emulation —
  # the DuckDB C++ build is far too slow under QEMU) and push each by digest.
  # `docker-merge` then assembles the multi-arch manifest. When opted in each arch
  # builds on its native self-hosted box (gcp-builder is X64, gcp-builder-arm is
  # ARM64); otherwise on the hosted runner from the matrix.
  docker:
    name: Build pivot image (${{ matrix.arch }})
    needs: [start-ci, start-ci-arm]
    # The start jobs are skipped unless opted in, so accept their skipped results.
    if: ${{ always() && inputs.push_docker && (needs.start-ci.result == 'success' || needs.start-ci.result == 'skipped') && (needs.start-ci-arm.result == 'success' || needs.start-ci-arm.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ inputs.use_gcp_runner && (matrix.arch == 'amd64' && 'gcp-builder' || 'gcp-builder-arm') || matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Unique builder name per job. These self-hosted boxes run several runners
      # sharing one Docker daemon; without a unique name a sibling job's buildx
      # cleanup (docker buildx rm) tears down this build's BuildKit mid-run
      # (graceful_stop).
      - uses: docker/setup-buildx-action@v3
        with:
          name: builder-${{ github.run_id }}-${{ github.job }}-${{ matrix.arch }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=giladkl/pivot,push-by-digest=true,name-canonical=true,push=true
          # Plain per-arch manifests (no attestation index) so their digests
          # compose cleanly into the merged manifest list below.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          # ignore-error so a transient Actions Cache outage never fails the build.
          cache-to: type=gha,scope=server-${{ matrix.arch }},mode=max,ignore-error=true

      # runner.temp is unique per job and cleaned at job start, so on the
      # persistent self-hosted runners it holds only this build's digest (a
      # shared /tmp/digests would accumulate stale digests across runs).
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-pivot-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  # Assemble the per-arch digests into one multi-arch manifest tagged with the
  # commit SHA and `latest`.
  docker-merge:
    name: Merge pivot manifest
    needs: [docker]
    if: ${{ always() && inputs.push_docker && needs.docker.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-pivot-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t giladkl/pivot:${{ github.sha }} \
            -t giladkl/pivot:latest \
            $(printf 'giladkl/pivot@sha256:%s ' *)
          docker buildx imagetools inspect giladkl/pivot:${{ github.sha }}

  # Same native-per-arch build for the operator/router image. It is
  # self-contained (no submodules, no DuckDB). When opted in each arch builds on
  # its native self-hosted box (gcp-builder / gcp-builder-arm); otherwise on the
  # hosted runner from the matrix.
  docker-operator:
    name: Build operator image (${{ matrix.arch }})
    needs: [start-ci, start-ci-arm]
    # The start jobs are skipped unless opted in, so accept their skipped results.
    if: ${{ always() && inputs.push_docker && (needs.start-ci.result == 'success' || needs.start-ci.result == 'skipped') && (needs.start-ci-arm.result == 'success' || needs.start-ci-arm.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ inputs.use_gcp_runner && (matrix.arch == 'amd64' && 'gcp-builder' || 'gcp-builder-arm') || matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Unique builder name per job (shared-daemon multi-runner box); see the
      # pivot build job for why.
      - uses: docker/setup-buildx-action@v3
        with:
          name: builder-${{ github.run_id }}-${{ github.job }}-${{ matrix.arch }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: operator
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=giladkl/pivot-operator,push-by-digest=true,name-canonical=true,push=true
          # Plain per-arch manifests (no attestation index) so their digests
          # compose cleanly into the merged manifest list below.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=operator-${{ matrix.arch }}
          # ignore-error so a transient Actions Cache outage never fails the build.
          cache-to: type=gha,scope=operator-${{ matrix.arch }},mode=max,ignore-error=true

      # runner.temp is unique per job and cleaned at job start, so on the
      # persistent self-hosted runners it holds only this build's digest (a
      # shared /tmp/digests would accumulate stale digests across runs).
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-operator-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  docker-operator-merge:
    name: Merge operator manifest
    needs: [docker-operator]
    if: ${{ always() && inputs.push_docker && needs.docker-operator.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-operator-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t giladkl/pivot-operator:${{ github.sha }} \
            -t giladkl/pivot-operator:latest \
            $(printf 'giladkl/pivot-operator@sha256:%s ' *)
          docker buildx imagetools inspect giladkl/pivot-operator:${{ github.sha }}

  # NOTE: no stop job here. Each self-hosted box runs an hourly if-unused cron
  # (suspend on ci-runner-x86, stop on ci-runner-aarch64) that only takes it down when
  # no ci/deploy run is active, so it can't be killed out from under a
  # concurrent run — which an unconditional stop job here would do.
