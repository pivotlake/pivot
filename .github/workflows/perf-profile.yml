name: Perf profile

# Profile pivotdb's hot ClickBench runs on the perf box: build one PGO server
# from the run's commit, then for every query record the engine's own stats
# (exec wall time vs. summed worker CPU), psql-measured hot timings, and flat
# `perf` profiles of the server while the query repeats (DWARF call graphs for
# the queries named in callgraph_query). The reports are uploaded as an
# artifact. Same box handling as perf-ab.yml: the instance is started, retyped
# on request, and stopped again.

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Comma-separated ClickBench query numbers, 0-based. Empty = all 43."
        required: false
        default: ""
      callgraph_query:
        description: "Queries (0-based, comma-separated) to also profile with DWARF call graphs."
        required: false
        default: ""
      runs:
        description: "Hot runs per query for the timings and each profile."
        required: false
        default: "7"
      clickbench_ref:
        description: "Ref of the ClickBench fork (pivotlake/ClickBench_testing) providing the pivot-parquet harness."
        required: false
        default: "pivotdb-ab-server-bin"
      instance_type:
        description: "EC2 instance type to run the perf box as (see perf-ab.yml)."
        type: choice
        options:
          - c8g.metal-48xl
          - c8g.4xlarge
        default: c8g.metal-48xl

jobs:
  perf-profile:
    name: Hot-run profile on perf box
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PERF_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PERF_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.PERF_AWS_REGION || 'eu-central-1' }}
      SSH_USER: ${{ vars.PERF_SSH_USER || 'ubuntu' }}
      HITS_PATH: ${{ vars.PERF_HITS_PATH || '~/hits' }}
      PGO_SUBSET_PATH: ${{ vars.PERF_PGO_SUBSET_PATH || '~/hits-pgo-subset' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # The ClickBench pivot-parquet harness lives in the fork, not this repo;
      # check it out (pinned to clickbench_ref) so the harness version is
      # explicit rather than whatever happens to be on the box.
      - name: Check out ClickBench harness
        uses: actions/checkout@v4
        with:
          repository: pivotlake/ClickBench_testing
          ref: ${{ inputs.clickbench_ref }}
          path: clickbench-src

      - name: Start the perf box
        env:
          INSTANCE_ID: ${{ vars.PERF_AWS_INSTANCE_ID }}
          NAME_FILTER: ${{ vars.PERF_NAME_FILTER || 'perf-*' }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
        run: |
          set -euo pipefail
          # The CPU architecture is baked into a box's AMI, so the requested
          # type decides which box can serve the run: c8g* needs the arm64
          # fleet, every other offered type is an x86_64 retype of the x86 box.
          case "$INSTANCE_TYPE" in
            c8g*) ARCH=arm64 ;;
            *)    ARCH=x86_64 ;;
          esac

          id="$INSTANCE_ID"
          if [ -n "$id" ]; then
            pinned_arch=$(aws ec2 describe-instances --instance-ids "$id" \
              --query 'Reservations[0].Instances[0].Architecture' --output text)
            if [ "$pinned_arch" != "$ARCH" ]; then
              echo "PERF_AWS_INSTANCE_ID pins a $pinned_arch box but $INSTANCE_TYPE needs $ARCH; discovering by name instead."
              id=""
            fi
          fi
          if [ -z "$id" ]; then
            # No usable explicit id: pick a box whose Name tag and architecture
            # match, preferring a stopped one (never commandeer a running box
            # unless it is the only match and was named for perf).
            id=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=$NAME_FILTER" \
                        "Name=architecture,Values=$ARCH" \
                        "Name=instance-state-name,Values=stopped" \
              --query 'Reservations[0].Instances[0].InstanceId' --output text)
            if [ "$id" = "None" ] || [ -z "$id" ]; then
              echo "::error::no stopped $ARCH instance matching Name=$NAME_FILTER; set the PERF_AWS_INSTANCE_ID variable."
              exit 1
            fi
          fi
          echo "INSTANCE_ID=$id" >> "$GITHUB_ENV"
          echo "Using instance $id"

          state=$(aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Current state: $state"

          current_type=$(aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].InstanceType' --output text)
          if [ "$INSTANCE_TYPE" != "$current_type" ]; then
            # EC2 only allows a type change on a stopped instance; a box that is
            # already running is likely in use, so never stop it just for this.
            if [ "$state" != "stopped" ]; then
              echo "::error::instance type change ($current_type -> $INSTANCE_TYPE) requested but $id is $state, not stopped."
              exit 1
            fi
            echo "Changing instance type: $current_type -> $INSTANCE_TYPE"
            aws ec2 modify-instance-attribute --instance-id "$id" \
              --instance-type "Value=$INSTANCE_TYPE"
          else
            echo "Instance type: $current_type"
          fi

          if [ "$state" != "running" ]; then
            aws ec2 start-instances --instance-ids "$id" >/dev/null
          fi
          aws ec2 wait instance-running --instance-ids "$id"

          ip=$(aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          if [ "$ip" = "None" ] || [ -z "$ip" ]; then
            echo "::error::instance $id has no public IP to ssh to."
            exit 1
          fi
          echo "PERF_IP=$ip" >> "$GITHUB_ENV"
          echo "Public IP: $ip"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PERF_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_perf
          chmod 600 ~/.ssh/id_perf
          cat >> ~/.ssh/config <<EOF
          Host perf
            HostName $PERF_IP
            User $SSH_USER
            IdentityFile ~/.ssh/id_perf
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 20
            ConnectTimeout 15
          EOF
          # Wait for sshd to accept connections after the fresh boot.
          for _ in $(seq 1 60); do
            if ssh perf true 2>/dev/null; then
              echo "SSH is up."; exit 0
            fi
            sleep 5
          done
          echo "::error::timed out waiting for SSH on $PERF_IP"
          exit 1

      - name: Refuse to run if anyone else is logged in
        run: |
          set -euo pipefail
          # `who` includes our own pty, so > 1 means a real user is present.
          count=$(ssh perf 'who | wc -l' | tr -d ' ')
          if [ "$count" -gt 1 ]; then
            echo "::error::another user is logged in on the perf box; refusing to run."
            ssh perf who
            exit 1
          fi
          echo "No other users logged in (who count: $count)."

      - name: Ensure the box has the build deps
        run: |
          set -euo pipefail
          # The instrumented PGO build links with lld: instrumentation grows the
          # text past the aarch64 128MB branch range and GNU ld fails with
          # relocation overflows. The tpch A/B AMI bakes lld in, but this box is
          # long-lived and predates that, so install it rather than assume it.
          ssh perf 'command -v ld.lld >/dev/null \
            || sudo DEBIAN_FRONTEND=noninteractive apt-get install -qy lld'

      - name: Sync the source tree to the box
        run: |
          set -euo pipefail
          rsync_opts=(-az --checksum --no-times --delete \
            --exclude='.git' --exclude='target' \
            --exclude='target-pgogen' --exclude='target-pgouse' \
            --exclude='clickbench-src')
          ssh perf 'mkdir -p ~/perf-ab'
          rsync "${rsync_opts[@]}" -e "ssh -F $HOME/.ssh/config" ./ perf:perf-ab/after/
          rsync -az --delete --exclude='.git' \
            -e "ssh -F $HOME/.ssh/config" clickbench-src/ perf:perf-ab/ClickBench/
          scp -F "$HOME/.ssh/config" benchmarks/clickbench/profile-hot.sh perf:/tmp/profile-hot.sh

      - name: Install perf on the box
        run: |
          set -euo pipefail
          ssh perf 'command -v perf >/dev/null \
            || sudo DEBIAN_FRONTEND=noninteractive apt-get install -qy linux-tools-common linux-tools-aws \
            || sudo DEBIAN_FRONTEND=noninteractive apt-get install -qy linux-tools-common "linux-tools-$(uname -r)"'
          ssh perf 'perf --version'

      - name: Run the profile (detached, polled)
        env:
          QUERY: ${{ inputs.query }}
          CALLGRAPH_QUERY: ${{ inputs.callgraph_query }}
          RUNS: ${{ inputs.runs }}
        run: |
          set -euo pipefail
          query_arg=""
          [ -n "$QUERY" ] && query_arg="--query $QUERY"
          cg_arg=""
          [ -n "$CALLGRAPH_QUERY" ] && cg_arg="--callgraph-query $CALLGRAPH_QUERY"
          cat > /tmp/launch.sh <<EOF
          rm -rf /tmp/profile /tmp/profile.log /tmp/profile.pid
          setsid bash -c '
            echo \$\$ >/tmp/profile.pid
            trap '"'"'echo "=== PROFILE COMPLETE exit=\$? ==="'"'"' EXIT
            bash /tmp/profile-hot.sh \
              --tree ~/perf-ab/after \
              --clickbench-dir ~/perf-ab/ClickBench \
              --source '$HITS_PATH' --pgo-subset '$PGO_SUBSET_PATH' \
              --out /tmp/profile --runs '$RUNS' $query_arg $cg_arg
          ' >/tmp/profile.log 2>&1 </dev/null &
          EOF
          scp -F "$HOME/.ssh/config" /tmp/launch.sh perf:/tmp/launch.sh
          ssh perf 'bash /tmp/launch.sh'
          echo "launched the profile run on the box"
          sleep 10
          prev=""
          while true; do
            state=$(ssh perf '
              if kill -0 "$(cat /tmp/profile.pid 2>/dev/null)" 2>/dev/null; then
                echo alive
              elif grep -q "PROFILE COMPLETE" /tmp/profile.log 2>/dev/null; then
                echo done
              else
                echo dead
              fi')
            case "$state" in
              done) break ;;
              dead)
                echo "::error::the profile process vanished without a sentinel."
                ssh perf 'tail -n 60 /tmp/profile.log' || true
                exit 1 ;;
              *)
                cur=$(ssh perf 'tail -n 3 /tmp/profile.log' 2>/dev/null || true)
                if [ "$cur" != "$prev" ]; then printf '%s\n' "$cur"; fi
                prev=$cur
                sleep 20 ;;
            esac
          done
          ssh perf 'tar -C /tmp -czf /tmp/profile.tgz profile profile.log'
          scp -F "$HOME/.ssh/config" perf:/tmp/profile.tgz profile.tgz
          mkdir -p profile-out && tar -C profile-out -xzf profile.tgz
          exit_line=$(grep -o 'PROFILE COMPLETE exit=[0-9]*' profile-out/profile.log | tail -1)
          code="${exit_line##*=}"
          echo "profile exit code: ${code:-unknown}"
          {
            echo "## pivotdb hot-run profile"
            echo '```'
            cat profile-out/profile/machine.txt 2>/dev/null || true
            echo
            cat profile-out/profile/stats.txt 2>/dev/null || echo "(no stats captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${code:-1}" = "0" ]

      - name: Upload profile
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-profile
          path: profile-out
          if-no-files-found: ignore

      - name: Stop the perf box
        if: ${{ always() && env.INSTANCE_ID != '' }}
        run: |
          set -euo pipefail
          echo "Stopping ${INSTANCE_ID}"
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID" >/dev/null || true

          # Always park the box as its family's 4xlarge, so a run on a bigger
          # type never leaves it behind for whoever starts the box next. The
          # family follows the box's architecture. The type can only be changed
          # once the instance has fully stopped.
          arch=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].Architecture' --output text)
          case "$arch" in
            x86_64) RESTORE_TYPE=c7a.4xlarge ;;
            *)      RESTORE_TYPE=c8g.4xlarge ;;
          esac
          current_type=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].InstanceType' --output text)
          if [ "$current_type" != "$RESTORE_TYPE" ]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            echo "Restoring instance type: $current_type -> $RESTORE_TYPE"
            aws ec2 modify-instance-attribute --instance-id "$INSTANCE_ID" \
              --instance-type "Value=$RESTORE_TYPE"
          fi
