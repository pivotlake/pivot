name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_gcp_runner:
        description: "Build the docs on the self-hosted GCP runner (ci-runner-x86). On by default; uncheck to use a GitHub-hosted runner."
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Bypass the kache rustc wrapper (.cargo/config.toml): kache is only
  # installed on dev machines.
  RUSTC_WRAPPER: ""

# Like ci.yml, the docs build defaults to the self-hosted `ci-runner-x86` GCP VM
# (gcp-builder label). Pushes to main resume the VM and build there; a manual
# dispatch can opt out with use_gcp_runner=false. The box's hourly
# suspend-if-unused cron suspends it again once no run is active.
jobs:
  # Resume the GCP VM so its runners come online before the docs build dispatches.
  start-ci:
    name: Start GCP runner
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_gcp_runner }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/resume-gcp-runner
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

  deploy:
    needs: [start-ci]
    # start-ci is skipped on a dispatch opt-out, so accept its skipped result too.
    if: ${{ always() && (needs.start-ci.result == 'success' || needs.start-ci.result == 'skipped') }}
    name: Deploy Docs
    # Default to the self-hosted box; a dispatch opt-out routes back to hosted.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && !inputs.use_gcp_runner) && 'ubuntu-latest' || 'gcp-builder' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build user documentation
        run: |
          python -m pip install -r requirements-docs.txt
          python -m mkdocs build --strict

      - name: Build Rust API documentation
        working-directory: dispatch
        run: |
          # ci-runner-x86 is Ubuntu 20.04 with gcc 9.4, which aws-lc-sys rejects
          # (GCC bug 95189). Build the C/C++ deps with clang there; GitHub-hosted
          # runners have a newer, unaffected gcc, so leave them on the default.
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            export CC=clang CXX=clang++
          fi
          cargo doc --no-deps

      - name: Add Rust API documentation to the site
        run: |
          mkdir -p site/api
          cp -R target/doc/. site/api/
          printf '%s\n' '<meta http-equiv="refresh" content="0;url=dispatch/">' > site/api/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
