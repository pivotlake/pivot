name: JSONBench A/B

# Compare pivotdb performance across two commits ("before" vs "after") on the
# JSONBench suite, on a FRESHLY LAUNCHED instance-store machine that is
# terminated when the run ends. The box does all the work itself
# (benchmarks/jsonbench/bench-jsonbench-ab.sh): checkouts from an AMI-baked repo
# clone, a download of the public Bluesky ndjson overlapping the builds, PGO (or
# plain release) builds per side with warm cargo caches restored from S3, then a
# per-side load-once-and-query measurement. Fails on a cold-query or ingest
# (load) regression past the threshold or an output mismatch between the sides.
# Manual trigger only.
#
# Reuses the TPC-H A/B box image and infrastructure: everything JSONBench needs
# (Rust toolchain, llvm-tools, DuckDB, the repo clone) is already baked there,
# so there is no separate AMI to maintain. Set the JSONBENCH_AB_* variables
# only to override the TPC-H defaults.
#
# Required secrets (shared with perf-ab / tpch-ab):
#   PERF_AWS_ACCESS_KEY_ID / PERF_AWS_SECRET_ACCESS_KEY
#       AWS credentials allowed to ec2:RunInstances / DescribeInstances /
#       TerminateInstances (and to pass the instance profile, if set).
#   TPCH_AB_SSH_KEY
#       Private key matching the key pair the box authorizes at launch. Falls
#       back to PERF_SSH_KEY when unset.
# Required repository variables:
#   TPCH_AB_AMI_ID (or JSONBENCH_AB_AMI_ID to override) - AMI baked by
#       benchmarks/tpch/bake-tpch-ab-ami.sh.
# Optional repository variables (defaults in parentheses):
#   JSONBENCH_AB_REGION        (TPCH_AB_REGION | eu-central-1)
#   JSONBENCH_AB_INSTANCE_TYPE (TPCH_AB_INSTANCE_TYPE | c8gd.4xlarge) -
#       instance-store NVMe required; keep one type so timings stay comparable
#       across runs.
#   JSONBENCH_AB_KEY_NAME      (falls back to TPCH_AB_KEY_NAME)
#   JSONBENCH_AB_SUBNET_ID / JSONBENCH_AB_SECURITY_GROUP  (TPCH_AB_* | account
#       defaults) - the security group must allow ssh from the runner.
#   JSONBENCH_AB_INSTANCE_PROFILE (TPCH_AB_INSTANCE_PROFILE | none) - only
#       needed for the warm S3 build cache; the public dataset needs no creds.
#   JSONBENCH_AB_CACHE_PREFIX  - unset or empty
#       string disables warm caches (every run builds cold). The instance
#       profile must be able to read/write this prefix.

on:
  workflow_dispatch:
    inputs:
      before_ref:
        description: "Baseline commit/ref ('before'). Empty = HEAD^ (the parent of the run's commit)."
        required: false
        default: ""
      after_ref:
        description: "Candidate commit/ref ('after'). Empty = the run's commit (HEAD)."
        required: false
        default: ""
      scale:
        description: "Dataset size: number of upstream Bluesky files (1m=1, 10m=10, 100m=100). 100m downloads ~12.5GB and loads it per side."
        type: choice
        options: ["1m", "10m", "100m"]
        default: "10m"
      build_mode:
        description: "pgo = full PGO per side (the decision tool). release = plain cargo --release (fast iteration; numbers carry alignment noise)."
        type: choice
        options: [pgo, release]
        default: pgo
      query:
        description: "Comma-separated suite query ids (e.g. q01,q03). Empty = all."
        required: false
        default: ""
      iterations:
        description: "Tries per query (try 1 = cold, min of the rest = hot)."
        required: false
        default: "3"
      passes:
        description: "Measurement passes; cold/hot/load are per-key mins across passes. Each pass reloads the dataset per side."
        required: false
        default: "1"
      regression_pct:
        description: "Cold-query / load-time regression threshold (percent) that fails the run."
        required: false
        default: "5"
      run_duckdb:
        description: "Also time DuckDB over the same ndjson as a reference column (never gates)."
        type: boolean
        default: false
      bench_env:
        description: "Extra env for both sides' runs, space-separated KEY=VALUE (e.g. PIVOT_MEMORY_PCT=40)."
        required: false
        default: ""

jobs:
  jsonbench-ab:
    name: JSONBench A/B on a fresh box
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PERF_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PERF_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.JSONBENCH_AB_REGION || vars.TPCH_AB_REGION || 'eu-central-1' }}
      CACHE_PREFIX: ${{ vars.JSONBENCH_AB_CACHE_PREFIX }}

    steps:
      # No submodules: the box resolves sources from its baked clone. The full
      # history is still needed to resolve arbitrary before/after refs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve before/after commits
        env:
          BEFORE_REF: ${{ inputs.before_ref }}
          AFTER_REF: ${{ inputs.after_ref }}
        run: |
          set -euo pipefail
          git fetch --all --no-tags --quiet || true
          after_sha=$(git rev-parse "${AFTER_REF:-HEAD}")
          before_sha=$(git rev-parse "${BEFORE_REF:-HEAD^}")
          if [ "$after_sha" = "$before_sha" ]; then
            echo "::error::before and after resolve to the same commit ($after_sha)"
            exit 1
          fi
          echo "AFTER_SHA=$after_sha"  >> "$GITHUB_ENV"
          echo "BEFORE_SHA=$before_sha" >> "$GITHUB_ENV"
          echo "after=$after_sha before=$before_sha"

      - name: Launch a fresh box
        env:
          AMI_ID: ${{ vars.JSONBENCH_AB_AMI_ID || vars.TPCH_AB_AMI_ID }}
          INSTANCE_TYPE: ${{ vars.JSONBENCH_AB_INSTANCE_TYPE || vars.TPCH_AB_INSTANCE_TYPE || 'c8gd.4xlarge' }}
          KEY_NAME: ${{ vars.JSONBENCH_AB_KEY_NAME || vars.TPCH_AB_KEY_NAME }}
          INSTANCE_PROFILE: ${{ vars.JSONBENCH_AB_INSTANCE_PROFILE || vars.TPCH_AB_INSTANCE_PROFILE }}
          SUBNET_ID: ${{ vars.JSONBENCH_AB_SUBNET_ID || vars.TPCH_AB_SUBNET_ID }}
          SECURITY_GROUP: ${{ vars.JSONBENCH_AB_SECURITY_GROUP || vars.TPCH_AB_SECURITY_GROUP }}
        run: |
          set -euo pipefail
          [ -n "$AMI_ID" ] || { echo "::error::no AMI id; set TPCH_AB_AMI_ID (or JSONBENCH_AB_AMI_ID). Bake one with benchmarks/tpch/bake-tpch-ab-ami.sh"; exit 1; }
          [ -n "$KEY_NAME" ] || { echo "::error::no EC2 key pair; set TPCH_AB_KEY_NAME (or JSONBENCH_AB_KEY_NAME) to a key pair whose private half is in PERF_SSH_KEY"; exit 1; }

          args=(--image-id "$AMI_ID" --instance-type "$INSTANCE_TYPE" --count 1
                --key-name "$KEY_NAME"
                --instance-initiated-shutdown-behavior terminate
                --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=jsonbench-ab-${GITHUB_RUN_ID}}]")
          # The build cache is the only thing that needs credentials; the public
          # dataset does not. So the profile is optional.
          [ -n "$INSTANCE_PROFILE" ] && args+=(--iam-instance-profile "Name=$INSTANCE_PROFILE")
          [ -n "$SUBNET_ID" ] && args+=(--subnet-id "$SUBNET_ID")
          [ -n "$SECURITY_GROUP" ] && args+=(--security-group-ids "$SECURITY_GROUP")

          # Belt-and-braces leak guard: the instance halts itself after 4h and
          # a halt terminates it (shutdown behavior above), so a runner that
          # dies mid-job cannot leave the box running forever.
          id=$(aws ec2 run-instances "${args[@]}" \
            --user-data '#!/bin/bash
          shutdown -h +240' \
            --query 'Instances[0].InstanceId' --output text)
          echo "INSTANCE_ID=$id" >> "$GITHUB_ENV"
          echo "Launched $id"

          aws ec2 wait instance-running --instance-ids "$id"
          ip=$(aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          if [ "$ip" = "None" ] || [ -z "$ip" ]; then
            echo "::error::instance $id has no public IP to ssh to."
            exit 1
          fi
          echo "BOX_IP=$ip" >> "$GITHUB_ENV"
          echo "Public IP: $ip"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TPCH_AB_SSH_KEY || secrets.PERF_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ab
          chmod 600 ~/.ssh/id_ab
          cat >> ~/.ssh/config <<EOF
          Host box
            HostName $BOX_IP
            User ubuntu
            IdentityFile ~/.ssh/id_ab
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 20
            ConnectTimeout 15
          EOF
          for _ in $(seq 1 60); do
            if ssh box true 2>/dev/null; then
              echo "SSH is up."; exit 0
            fi
            sleep 5
          done
          echo "::error::timed out waiting for SSH on $BOX_IP"
          ssh -v box true 2>&1 | tail -8 || true
          exit 1

      - name: Run A/B (detached, polled)
        env:
          SCALE: ${{ inputs.scale }}
          BUILD_MODE: ${{ inputs.build_mode }}
          QUERY: ${{ inputs.query }}
          ITERATIONS: ${{ inputs.iterations }}
          PASSES: ${{ inputs.passes }}
          REGRESSION_PCT: ${{ inputs.regression_pct }}
          RUN_DUCKDB: ${{ inputs.run_duckdb }}
          BENCH_ENV: ${{ inputs.bench_env }}
          # Ephemeral, repo-read token: lets the box fetch the two commits into
          # its baked clone. It expires when the job ends and the box is
          # terminated regardless.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Ship the harness and its shared library from the run's commit (the
          # 'before' commit may predate them). The harness sources the library
          # by relative path, so both land in the same /tmp directory.
          scp -F "$HOME/.ssh/config" benchmarks/jsonbench/bench-jsonbench-ab.sh box:/tmp/bench-jsonbench-ab.sh
          scp -F "$HOME/.ssh/config" benchmarks/lib/bench-ab-common.sh box:/tmp/bench-ab-common.sh

          query_arg=""
          [ -n "$QUERY" ] && query_arg="--query '$QUERY'"
          duckdb_arg=""
          [ "$RUN_DUCKDB" = "true" ] && duckdb_arg="--duckdb"
          env_arg=""
          [ -n "$BENCH_ENV" ] && env_arg="--bench-env '$BENCH_ENV'"

          cat > /tmp/launch.sh <<EOF
          rm -f /tmp/ab.log /tmp/ab-report.txt /tmp/bench-jsonbench-ab.pid
          setsid bash /tmp/bench-jsonbench-ab.sh \
            --mirror /opt/pivotdb \
            --repo-url 'https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git' \
            --before '$BEFORE_SHA' --after '$AFTER_SHA' \
            --before-label '${BEFORE_SHA:0:12}' --after-label '${AFTER_SHA:0:12}' \
            --cache-prefix '$CACHE_PREFIX' \
            --scale '$SCALE' --mode '$BUILD_MODE' \
            --iterations '$ITERATIONS' --passes '$PASSES' \
            --regression-pct '$REGRESSION_PCT' \
            --report /tmp/ab-report.txt \
            $query_arg $duckdb_arg $env_arg >/tmp/ab.log 2>&1 </dev/null &
          EOF
          scp -F "$HOME/.ssh/config" /tmp/launch.sh box:/tmp/launch.sh
          ssh box 'bash /tmp/launch.sh && rm -f /tmp/launch.sh'
          echo "launched A/B run on the box"
          sleep 10

          # Poll: liveness first, then the sentinel; the EXIT trap writes the
          # sentinel before the process dies, so "pid gone + no sentinel" only
          # means an untrappable kill.
          while true; do
            state=$(ssh box '
              if kill -0 "$(cat /tmp/bench-jsonbench-ab.pid 2>/dev/null)" 2>/dev/null; then
                echo alive
              elif grep -q "BENCH-JSONBENCH-AB COMPLETE" /tmp/ab.log 2>/dev/null; then
                echo done
              else
                echo dead
              fi')
            case "$state" in
              done) break ;;
              dead)
                echo "::error::A/B process vanished without a sentinel (likely OOM/kill)."
                ssh box 'tail -n 60 /tmp/ab.log' || true
                exit 1 ;;
              *)
                ssh box 'tail -n 2 /tmp/ab.log' 2>/dev/null || true
                sleep 20 ;;
            esac
          done

          exit_line=$(ssh box "grep -o 'BENCH-JSONBENCH-AB COMPLETE exit=[0-9]*' /tmp/ab.log | tail -1")
          code="${exit_line##*=}"
          echo "A/B exit code: ${code:-unknown}"

          scp -F "$HOME/.ssh/config" box:/tmp/ab-report.txt ab-report.txt || true
          scp -F "$HOME/.ssh/config" box:/tmp/ab.log ab-full.log || true
          {
            echo "## pivotdb JSONBench A/B ($BUILD_MODE, $SCALE)"
            echo ""
            echo "before \`${BEFORE_SHA:0:12}\` vs after \`${AFTER_SHA:0:12}\`"
            echo ""
            echo '```'
            cat ab-report.txt 2>/dev/null || echo "(no report captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${code:-1}" != "0" ]; then
            echo "::error::A/B run reported a cold-query or load regression, an output mismatch, or failed (exit=$code). See the job summary."
            exit 1
          fi
          echo "No cold-query or load regression past the threshold."

      - name: Upload A/B report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jsonbench-ab-report
          path: |
            ab-report.txt
            ab-full.log
          if-no-files-found: ignore

      - name: Terminate the box
        if: ${{ always() && env.INSTANCE_ID != '' }}
        run: |
          set -euo pipefail
          echo "Terminating ${INSTANCE_ID}"
          aws ec2 terminate-instances --instance-ids "$INSTANCE_ID" >/dev/null || true
