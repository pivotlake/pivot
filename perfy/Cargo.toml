[workspace]
resolver = "2"
members = ["crates/ibs-annotate", "crates/perfy-server"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
# None of these crates is published to crates.io.
publish = false

[workspace.dependencies]
ibs-annotate = { path = "crates/ibs-annotate" }
regex = "1.11"
once_cell = "1.20"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
ahash = { version = "0.8", features = ["serde"] }
memchr = "2.7"
linux-perf-data = "0.11"
linux-perf-event-reader = "0.10"
object = { version = "0.36", features = ["read"] }
rustc-demangle = "0.1"
cpp_demangle = "0.4"
byteorder = "1.5"
memmap2 = "0.9"
wholesym = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
