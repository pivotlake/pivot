[package]
name = "dispatch"
version = "0.1.0"
edition = "2024"

[dependencies]

arrow-array = { path = "../arrow-rs/arrow-array" }
arrow-schema = { path = "../arrow-rs/arrow-schema" }
arrow = { path = "../arrow-rs/arrow", features = ["prettyprint"] }
arrow-buffer = { path = "../arrow-rs/arrow-buffer"}

crossbeam-deque = "0.8.6"
core_affinity = "0.8.3"
thiserror = "2.0.18"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
memchr = "2.7"
ahash = "0.8.12"

tikv-jemallocator = "0.6.0"

bytes = "1.11.0"
libc = "0.2.178"

# HTTP(S) source support. rustls is sans-IO: we shuttle ciphertext between the
# socket (io_uring on Linux, blocking std::net elsewhere) and rustls's in-memory
# buffers, so TLS works identically on both backends. `ring` keeps the build lean
# (no cmake/C toolchain); roots are the bundled Mozilla set (no platform calls).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
# Byte-level HTTP/1.1 head parsing for the sans-IO range-read helpers
# (io::http::http1), driven from our own io_uring transport.
httparse = "1.9"
url = "2.5"

[features]
# Exposes `test_utils` and the test-only worker-waker / free-pool helpers so
# out-of-crate test suites (e.g. catalog's Parquet reader tests) can drive
# single operators. Enabled only via those crates' dev-dependencies.
test-util = []

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["fs", "uio"] }

[dev-dependencies]
tempfile = "3"
# Generate a self-signed cert so tests can stand up a loopback HTTPS server the
# client trusts via an injected root store.
rcgen = "0.13"
# Operator microbenchmarks (`benches/operators.rs`). `harness = false` below: we
# drive Criterion from our own `main` so a single `Dispatch` (worker pool) is
# spun up once and reused across every scenario, instead of per bench group.
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[[bench]]
name = "operators"
harness = false

# HTTP(S) range-read throughput (`benches/http_range.rs`): stands up a loopback
# backend and drives the HTTP engine via a standalone `IORequester`. Needs
# `test-util` for `init_test_free_pool` (the out-of-crate single-worker context).
[[bench]]
name = "http_range"
harness = false
required-features = ["test-util"]

[profile.profiling]
inherits = "release"
debug = true
