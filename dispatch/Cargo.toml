[package]
name = "dispatch"
version = "0.1.0"
edition = "2024"

[dependencies]

arrow-array = { path = "../arrow-rs/arrow-array" }
arrow-schema = { path = "../arrow-rs/arrow-schema" }
arrow = { path = "../arrow-rs/arrow", features = ["prettyprint"] }
arrow-buffer = { path = "../arrow-rs/arrow-buffer"}

crossbeam-deque = "0.8.6"
core_affinity = "0.8.3"
thiserror = "2.0.18"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
memchr = "2.7"
ahash = "0.8.12"

tikv-jemallocator = "0.6.0"

bytes = "1.11.0"
snap = { git = "https://github.com/Epsio-Labs/rust-snappy.git", rev="1e20a92f7bcad208bf6869f5394101288850ee2e" }
libc = "0.2.178"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["fs", "uio"] }

[dev-dependencies]
parquet = { path = "../arrow-rs/parquet", default-features = false, features = ["arrow", "snap"] }
tempfile = "3"

[profile.profiling]
inherits = "release"
debug = true

[[bench]]
name = "clickbench"
harness = false
