[package]
name = "session"
version.workspace = true
edition.workspace = true

[dependencies]
arrow-array = { workspace = true }
catalog = { workspace = true }
dispatch = { workspace = true }
lru = { workspace = true }
# `ByteSize` sizes the buffer pool with the config file's `8g` spelling.
metastore-disk = { workspace = true }
planner = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Reads and raises the process's open-file limit at startup (see `limits`).
nix = { version = "0.31.2", features = ["resource"] }

[dev-dependencies]
async-trait = "0.1"
