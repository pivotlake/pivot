[package]
name = "goose"
version = "0.1.0"
edition = "2024"

[dependencies]
planner = { path = "../planner" }
dispatch = { path = "../dispatch" }
thriftparquet = { path = "../thriftparquet" }
arrow-array = { path = "../arrow-rs/arrow-array" }
arrow-ord = { path = "../arrow-rs/arrow-ord" }
arrow-schema = { path = "../arrow-rs/arrow-schema" }
arrow-buffer = { path = "../arrow-rs/arrow-buffer" }
thiserror = "2.0.18"
bytes = "1.11.0"
crossbeam-deque = "0.8.6"
ahash = "0.8.12"
snap = { git = "https://github.com/Epsio-Labs/rust-snappy.git", rev = "1e20a92f7bcad208bf6869f5394101288850ee2e" }
# Catalog metadata is serialized as JSON (the `_goose_log/<version>.json`
# snapshots). serde replaces goose's hand-rolled json parser.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Object storage (s3://, gs://) for the catalog snapshot and remote data files.
# Same version/features ingest uses, so one resolution across the workspace.
object_store = { version = "0.12", features = ["gcp", "aws"] }
# object_store's API is async; the catalog drives it synchronously (off the hot
# path) via a small current-thread runtime. `net`/`time` are what its cloud HTTP
# client needs.
tokio = { version = "1", features = ["rt", "net", "time"] }

[dev-dependencies]
# `test-util` exposes dispatch's single-operator test harness for the moved
# Parquet reader unit/integration tests.
dispatch = { path = "../dispatch", features = ["test-util"] }
parquet = { path = "../arrow-rs/parquet", default-features = false, features = ["arrow", "snap"] }
arrow-schema = { path = "../arrow-rs/arrow-schema" }
arrow = { path = "../arrow-rs/arrow", features = ["prettyprint"] }
tempfile = "3"
core_affinity = "0.8.3"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[[bench]]
name = "clickbench"
harness = false