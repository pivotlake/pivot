[package]
name = "duckdb-planner"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true

[dependencies]
cxx = "1"
autocxx = "0.30.0"
serde_json = "1.0.149"
serde = { version = "1.0.149", features = ["derive"] }
serde_repr = "0.1"
custom_deserializer = { path = "custom_deserializer" }
thiserror = "2"
arrow = "58.0.0"
dispatch = { path = "../dispatch" }

[dev-dependencies]
libc = "0.2.184"
parquet = { version = "58.0.0", features = ["arrow"] }
tempfile = "3"

[build-dependencies]
cxx-build = { version = "1.0", features = ["parallel"] }
autocxx-build = "0.30.0"
cmake = "0.1"
