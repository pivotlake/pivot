[package]
name = "duckdb-planner"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true

[dependencies]
cxx = "1"
autocxx = "0.30.0"
thiserror = "2"
arrow = "58.0.0"
dispatch = { path = "../dispatch" }

[dev-dependencies]
libc = "0.2.184"
parquet = { version = "58.0.0", features = ["arrow"] }
tempfile = "3"
rstest = "0.23"
insta = "1"

[build-dependencies]
cxx-build = { version = "1.0", features = ["parallel"] }
autocxx-build = "0.30.0"
cmake = "0.1"
