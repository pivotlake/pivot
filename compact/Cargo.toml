[package]
name = "compact"
version.workspace = true
edition.workspace = true
description = "Background compaction of a table's small Parquet files into target-sized ones, offloading the CPU-heavy re-encode onto dispatch workers."

[dependencies]
dispatch = { workspace = true }
thriftparquet = { workspace = true }
# The catalog: candidates come from a table's manifest, reads resolve through
# it, and the merged files are swapped in through its table log.
catalog = { workspace = true }

arrow-array = { workspace = true }
arrow-schema = { workspace = true }
# Partitioned/sorted re-encode: lexsort + partition (arrow-ord), comparable row
# keys (arrow-row), and concat + take (arrow-select).
arrow-ord = { workspace = true }
arrow-row = { workspace = true }
arrow-select = { workspace = true }
arrow-arith = { workspace = true }
# Dictionary encoding: cast a column to a dictionary array (intern + index).
arrow-cast = { workspace = true }
# Variant (JSON) columns: `parquet-variant` supplies the value/path types the
# shredding inference walks, `parquet-variant-compute` the shred/unshred kernels
# each output file's layout is applied with.
parquet-variant = { workspace = true }
parquet-variant-compute = { workspace = true }
# In-house Parquet encoding (no upstream `parquet` crate): the shared
# `thriftparquet` metadata/codec layer plus the same snappy lib the reader uses.
snap = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Building struct arrays with null rows, to exercise the writer's definition
# levels directly.
arrow-buffer = { workspace = true }
# Reading a just-written file back from memory, without a temp file round-trip.
bytes = { workspace = true }
# Rendering a written-back variant to JSON to assert the documents survived
# shredding, the same way a query renders a variant output column.
parquet-variant-json = { workspace = true }
# `CreateTableRequest` etc., to set up catalog tables in the compaction tests.
planner = { workspace = true }
# Strict, spec-compliant reader used only as a test oracle: if arrow-rs's
# reader accepts our hand-rolled files, other engines (DuckDB, etc.) will too.
parquet = { workspace = true }
